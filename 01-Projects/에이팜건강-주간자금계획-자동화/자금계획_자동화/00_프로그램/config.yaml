company_name: (주)에이팜건강
timezone: Asia/Seoul
schedule:
  day_of_week: mon
  hour: 9
  minute: 10
startup:
  auto_start_with_windows: true
  initial_wait_seconds: 60
  check_missed_run: true
  run_missed_job_immediately: true
missed_run:
  enabled: true
  run_on_any_day_after_monday: true
  require_success_status: true
  prioritize_current_week: true
retry:
  enabled: true
  interval_minutes: 10
  end_time: '10:30'
  continue_after_program_restart: true
input_change:
  detect_after_success: true
  auto_rerun: false
  notify_user: true
folders:
  general_teams: ./01_일반팀_지출계획
  confidential_admin: ./02_경영지원_대외비
  bank_root: ./03_은행거래내역
  base_workbook: ./04_기준파일
  output: ./05_결과
  review: ./06_확인필요
  log: ./07_실행로그
  backup: ./08_백업
  archive: ./99_지난자료
forecast:
  default_receipt_rate: 0.8
  receipt_rates:
  - 0.6
  - 0.7
  - 0.8
  - 0.9
  - 1.0
  minimum_cash_balance: 0
  online_history_weeks: 12
  online_recency_halflife: 4
  auto_draft_default: 전체 제외
matching:
  date_window_days: 3
  name_similarity_threshold: 70
  partial_payment_tolerance: 0.05
bank:
  recent_days: 14
  month_end_top_day: 25
  internal_account_keywords:
  - 에이팜건강
  - (주)에이팜건강
  classify_rules_file: classify_rules.json
recurring:
  lookback_months: 6
  min_months: 4
options:
  create_excel: false
  create_management_report: true
  create_pdf_summary: true
  backup_input_files: true
  open_output_folder_after_manual_run: true
  keep_only_latest_outputs: true   # 05_결과에 최신 실행분만 유지
  keep_only_latest_bank_files: true   # 은행 폴더에 계좌별 최신 파일만 유지
base_workbook_name: 에이팜건강_자금계획_기준파일.xlsx
