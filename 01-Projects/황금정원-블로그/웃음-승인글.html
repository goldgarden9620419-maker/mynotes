<p class="lead-intro" data-ke-size="size16">80세까지 산다고 할 때 근심과 걱정을 안고 사는 시간은 6년 7개월, 깔깔 소리 내어 웃는 시간은 고작 20일이라고 합니다. 이 숫자를 듣고 저는 뜨끔했습니다. 하루를 돌아보면 웃지 않고 지나간 날이 정말 많았기 때문입니다.<br /><br />웃음이 몸에 어떤 약이 되는지, 그리고 어디까지 믿어야 하는지를 제 경험과 함께 정리해봤습니다.</p>

<section class="post-card">
<h2 data-ke-size="size26">억지웃음에도 효과는 진짜였다</h2>
<div class="card-body">
<p data-ke-size="size16">일반적으로 웃음은 기분 좋을 때 나오는 결과라고 알려져 있습니다. 그런데 의료 현장에서는 웃음을 치료 도구로 씁니다. 국내에서는 2001년 서울대학교병원이 유방암 환자들을 대상으로 웃음 치료를 처음 도입했고, 병원 게시판에는 웃음의 효과를 아예 약에 빗대 소개했다고 합니다. 혈압강하제, 항우울제, 수면제, 면역증강제, 천연 진통제, 소화제까지 겸하는 약이라는 겁니다. 웃을 때 부교감 신경이 활성화되기 때문인데, 부교감 신경이란 긴장을 풀고 몸을 회복 상태로 돌리는 자율신경을 말합니다.<br /><br />더 흥미로운 건 억지웃음도 통한다는 실험입니다. 참가자들에게 젓가락을 입에 물려 자기도 모르게 웃는 표정을 만들게 하고 스트레스 과제를 시켰더니, 웃는 근육을 쓴 사람들은 무표정 그룹보다 심박수가 빠르게 안정됐습니다. 웃는 줄 모르고 웃어도 몸은 반응한 겁니다. 특히 효과가 컸던 건 뒤센 미소였습니다. 뒤센 미소란 입꼬리만 올라가는 웃음과 달리 눈꼬리와 광대 근육까지 함께 움직이는 진짜 웃음을 가리킵니다.<br /><br />웃음 치료의 출발점이 된 일화도 있습니다. 강직성 척추염으로 10분도 잠들지 못하던 미국의 한 작가가 코미디 프로그램을 보고 웃은 날 한 시간을 내리 잔 경험을 계기로 의도적인 웃음을 반복했고, 통증에서 벗어난 과정을 책으로 남기며 웃음의 치유력이 알려졌습니다. 저도 비슷한 경험이 있습니다. 힘든 상황에서 농담 한마디에 다 같이 웃고 나면 문제는 그대로인데 그 문제를 바라보는 제 마음이 조금 가벼워져 있었습니다.<br /><br />참고: <a href="https://journals.sagepub.com/doi/abs/10.1177/0956797612445312" target="_blank" rel="noopener noreferrer">출처: Kraft &amp; Pressman, Psychological Science(2012)</a></p>
<div class="summary-card"><b>요약:</b> 병원이 약에 빗댈 만큼 웃음의 몸 효과는 확인되어 있습니다. 웃는 줄 모르는 억지웃음조차 스트레스 회복을 앞당겼습니다.</div>

<section class="post-card">
<h2 data-ke-size="size26">웃음 만능론은 경계합니다</h2>
<div class="card-body">
<p data-ke-size="size16">그렇다고 웃음이 만능이라고 보지는 않습니다. 감정이 준비되지 않은 상태에서 웃음을 강요당하면 오히려 병이 됩니다. 서비스직처럼 직업상 늘 웃어야 하는 분들이 겪는 스마일 우울증이 그 예입니다. 스마일 우울증이란 겉으로는 웃고 있지만 속으로는 우울이 쌓여가는 상태로, 가면 우울증이라고도 부릅니다. 억지 미소를 강요받던 항공사 승무원들이 집단 우울 증세를 보인 사례에서 가짜 웃음을 팬암 미소라고 부르게 됐을 정도입니다.<br /><br />그래서 저는 힘들어하는 사람에게 무조건 웃으라고 하는 말을 경계합니다. 그 말이 자기 감정을 숨기게 만들 수 있기 때문입니다. 제 결론은 이렇습니다. 웃음은 문제를 없애주는 치료제가 아니라 문제를 다른 시선으로 바라보고 다시 일어설 힘을 주는 방법입니다. 제 감정을 먼저 인정하되 그 감정에 너무 오래 끌려가지 않도록 웃음을 도구로 쓰는 겁니다.<br /><br />저도 회사 일과 관계, 앞날 걱정에 하루 종일 웃지 않고 지나가는 날이 많았습니다. 일이 안 풀리는 날엔 표정부터 굳었고 별것 아닌 일에 예민해졌습니다. 그래서 요즘은 웃을 일을 기다리는 대신 웃는 몸부터 만드는 연습을 합니다. 제가 하는 세 가지입니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">하루 한 번 15초 박장대소 — 발을 구르고 손가락에 힘을 준 박수, 상체를 흔들며 소리 내어 웃는다</li>
<li data-ke-size="size16">아침 거울 앞에서 &#39;나는 지금 잘하고 있어, 오케이&#39;를 외치고 한 번 웃는다</li>
<li data-ke-size="size16">많이 힘든 날은 웃음을 강요하지 않는다 — 감정을 먼저 적어 인정하고, 그다음에 예능 한 편을 본다</li>
</ul>
<p data-ke-size="size16">유머의 정의도 마음에 새겨뒀습니다. 독일 두덴 사전은 유머를 웃기는 재주로 설명하지 않고 삶의 고난과 역경에 유쾌하게 대처하는 능력이라고 풀이한다고 합니다. 잘 웃는 사람은 결국 잘 버티는 사람이었습니다.<br /><br />참고: <a href="https://www.amc.seoul.kr/asan/mobile/healthtv/video/videoDetail.do?videoId=3587&amp;categoryCode=C02009003" target="_blank" rel="noopener noreferrer">출처: 서울아산병원 건강TV(웃음 치료)</a></p>
<div class="summary-card"><b>요약:</b> 감정을 누른 채 웃기만 하면 스마일 우울증이 됩니다. 감정을 인정한 뒤 웃음을 회복 도구로 쓰는 게 저의 방식입니다.</div>

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 웃을 일이 없는데 어떻게 웃어?</b></p>
<p class="faq-a" data-ke-size="size16">A. 순서를 뒤집기로 했습니다. 웃을 일을 기다리지 않고 웃는 근육부터 움직입니다. 젓가락을 문 사람들도 몸이 반응했으니 저라고 안 될 이유가 없다고 생각합니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 억지로 웃는 건 가식 아닐까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 남에게 보여주려는 웃음과 저를 위한 웃음 운동은 다르다고 정리했습니다. 혼자 하는 박장대소는 스쿼트 같은 운동입니다. 보는 사람이 없으니 가식일 것도 없습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 힘들어하는 가족에게 웃으라고 해도 될까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 그 말은 아끼기로 했습니다. 감정이 준비되지 않은 사람에게는 강요가 될 수 있으니까요. 대신 먼저 이야기를 들어주고, 같이 웃을 수 있는 자리를 만드는 쪽을 택하겠습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 오늘 당장 뭐부터 해볼 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 자기 전에 15초 박장대소부터 해볼 겁니다. 민망하면 세수하러 들어간 화장실 거울 앞에서 하면 됩니다. 오늘 하루 몇 번 웃었는지 세어보는 것도 시작해보려 합니다.</p>
</div>
</div>

<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 행복해지면 웃겠다는 순서를 버리기로 했습니다. 평생 20일이라는 숫자를 보고 나니 웃을 일을 기다리다가는 너무 늦겠다 싶었습니다. 감정은 솔직하게 인정하되, 웃는 근육은 미리 움직여두는 것. 그게 제가 찾은 현실적인 절충입니다.<br /><br />오늘 하루 한 번도 웃지 않으셨다면 자기 전 15초만 소리 내어 웃어보시길 권합니다. 문제는 그대로여도 그 문제를 보는 눈이 조금 달라져 있을 겁니다.<br /><br />다음에 웃을 일이 없는 날 이 글을 찾아 헤매지 않으시려면 구독해두시는 걸 권합니다. 공감♥ 하나는 저에게 눈꼬리까지 접히는 뒤센 미소로 돌아옵니다.</p>
