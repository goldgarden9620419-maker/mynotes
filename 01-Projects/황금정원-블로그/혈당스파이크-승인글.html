<p class="lead-intro" data-ke-size="size16">공복 혈당과 식후 혈당의 차이가 50을 넘으면 혈당 스파이크를 의심할 수 있다고 합니다. 혈당 스파이크란 식사 후 혈당이 급하게 치솟았다가 뚝 떨어지는 현상인데, 밥만 먹으면 쏟아지는 식곤증이 그 대표 증상이라는 겁니다.<br /><br />이 대목에서 저는 뜨끔했습니다. 점심 먹고 눈꺼풀이 무거워지는 걸 수십 년 동안 당연하게 여기며 살았기 때문입니다. 제 오후를 무너뜨리던 졸음의 정체를 따라가 본 기록입니다.</p>
<p data-ke-size="size16"><br /><br /></p>

<section class="post-card">
<h2 data-ke-size="size26">제 혈당은 롤러코스터를 타고 있었다</h2>
<div class="card-body">
<p data-ke-size="size16">돌아보면 저는 혈당 스파이크가 생기기 딱 좋은 하루를 반복하고 있었습니다. 바쁜 아침에는 거의 못 먹고 출근했고, 점심에는 밥이나 면을 빠르게 많이 먹었습니다. 그러고 나면 사무실에서 집중이 무너지고 커피부터 찾았습니다. 그때는 나이가 들어 체력이 떨어졌나 생각했는데, 이 흐름이 교과서적인 혈당 롤러코스터였습니다.<br /><br />원리는 이렇습니다. 빵, 떡, 면, 흰쌀밥 같은 정제 탄수화물은 통곡물과 달리 도정 과정에서 섬유질이 깎여나가 흡수가 빠른 탄수화물인데, 빈속에 이런 음식이 한꺼번에 들어오면 혈당이 급상승합니다. 그러면 혈당을 낮추는 호르몬인 인슐린이 과하게 분비되고, 이번에는 혈당이 뚝 떨어집니다. 이 급락 구간에서 졸음, 집중력 저하, 짜증, 단것 당김이 몰려온다고 합니다. 오후마다 초콜릿을 찾던 제 손이 설명되는 순간이었습니다.<br /><br />무서운 건 이게 당뇨만의 문제로 끝나지 않는다는 점입니다. 혈당이 급등하면 최종당화산물(AGE)이 생기는데, 흔히 당독소라고 부르는 당 찌꺼기로 혈관 염증과 동맥경화를 일으켜 심혈관 질환, 신장병, 치매 위험까지 끌어올린다고 합니다. 실제로 혈당이 오르내리는 변동이 계속 높게 유지되는 고혈당보다 산화 스트레스를 더 강하게 활성화한다는 연구도 있습니다. 산화 스트레스란 세포를 녹슬게 하는 활성산소가 과해진 상태로 노화를 앞당기는 주범입니다. <a href="https://pubmed.ncbi.nlm.nih.gov/16609090/" target="_blank" rel="noopener noreferrer">출처: JAMA(미국의사협회지)</a><br /><br />그러니까 저를 재운 범인은 체력 대신 혈당이었을 가능성이 큽니다. 매일 반복되던 그 졸음이 사실은 혈관이 보내는 경고장이었던 셈입니다.</p>
<div class="summary-card"><b>요약:</b> 혈당 스파이크는 정제 탄수화물 위주의 식사 후 혈당이 급등했다가 인슐린 과분비로 급락하는 현상이며, 식곤증·집중력 저하·단것 당김이 대표 증상이다. 반복되면 당독소가 쌓여 혈관 손상과 가속 노화로 이어질 수 있다.</div>

<section class="post-card">
<h2 data-ke-size="size26">아침밥과 식후 15분이 처방이었다</h2>
<div class="card-body">
<p data-ke-size="size16">해법은 의외로 소박했습니다. 제일 먼저 아침을 챙겨 먹는 것. 아침을 거르면 점심에 폭식하게 되고 그게 스파이크로 직행하기 때문입니다. 대신 시리얼이나 빵으로 때우는 아침 말고 삶은 달걀 같은 단백질, 견과류나 요거트 같은 건강한 지방, 채소 같은 섬유질로 채우는 게 요령이라고 합니다. 제가 아침에 빵을 집던 날일수록 오후가 힘들었던 이유가 여기 있었습니다.<br /><br />피해야 할 것은 세 가지 하얀색으로 기억하면 됩니다. 밀가루, 설탕, 흰쌀밥입니다. 여기에 과자, 젤리, 아이스크림 같은 가공식품에 든 액상과당은 특히 조심해야 하는데, 포만감을 조절하는 식욕 호르몬의 통제를 받지 않아 먹어도 먹어도 계속 들어가는 당이기 때문입니다.<br /><br />그리고 운동은 양보다 타이밍이었습니다. 혈당 스파이크가 시작되는 식후 15분에서 30분이 골든타임이라, 이때 앉거나 눕는 대신 가볍게 몸을 움직이면 혈당이 치솟는 걸 원천 차단할 수 있다고 합니다. 저는 아침 걷기는 몇 년째 유지하면서 정작 식사 직후에는 한 번도 움직이지 않았다는 걸 이번에 깨달았습니다. 그래서 제 실천은 세 줄로 정리됐습니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">아침은 거르지 않되 삶은 달걀·요거트·채소처럼 단백질과 섬유질 위주로 간단히 먹기</li>
<li data-ke-size="size16">점심 먹고 바로 앉는 대신 10분만 걷거나 계단 오르기 (옆 사람과 대화가 가능한 정도의 강도)</li>
<li data-ke-size="size16">밀가루·설탕·흰쌀밥은 끊기보다 양과 속도를 줄이는 쪽으로 관리하기</li>
</ul>
<p data-ke-size="size16">다만 한 가지는 선을 긋고 싶습니다. 식곤증이 있다고 해서 전부 혈당 스파이크로 연결하는 건 조심해야 한다고 봅니다. 잠이 부족했거나 과로했거나 단순히 많이 먹어서 졸릴 수도 있으니까요. 몇 가지 증상만으로 스스로 진단하기보다 반복된다면 검진으로 확인하고, 궁금하면 질병관리청 국가건강정보포털에서 당뇨 전 단계 정보를 찾아보시길 권합니다. <a href="https://health.kdca.go.kr/" target="_blank" rel="noopener noreferrer">출처: 질병관리청 국가건강정보포털</a></p>
<div class="summary-card"><b>요약:</b> 혈당 스파이크 예방의 핵심은 단백질·섬유질 위주의 아침 식사, 밀가루·설탕·흰쌀밥 줄이기, 그리고 식후 15~30분 골든타임에 10분 걷기다. 운동 강도는 대화가 가능한 정도면 충분하며 과격한 운동은 오히려 혈당을 올린다.</div>
</div>

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 밥만 먹으면 졸린 게 정말 다 혈당 때문이야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 전부는 아니었습니다. 수면 부족이나 과로, 단순 과식으로도 졸릴 수 있으니까요. 다만 같은 패턴이 반복되고 단것 당김·식은땀·두근거림까지 같이 온다면 그때는 혈당 쪽을 의심해보기로 했습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 당뇨도 아닌데 이렇게까지 신경 써야 해?</b></p>
<p class="faq-a" data-ke-size="size16">A. 당뇨가 없어도 단순당을 빠르게 많이 먹으면 누구에게나 생기는 현상이라고 합니다. 게다가 혈당 변동은 당뇨 이전에 노화와 혈관 손상부터 건드립니다. 저는 젊게 살고 싶어서 신경 쓰기로 했습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 식후에 아예 뛰면 더 좋은 거 아니야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 과격한 운동은 오히려 혈당을 올린다고 해서 접었습니다. 대화가 가능한 강도로 10분에서 20분, 짧게 자주 움직이는 게 혈당 관리에는 충분하다고 합니다. 산책과 계단이면 됩니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 내일 아침 뭐부터 바꿀 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 삶은 달걀 두 개와 요거트를 냉장고에 채워둘 겁니다. 그리고 점심 먹고 엘리베이터 대신 계단으로 사무실에 올라가 보려고 합니다. 거창한 운동보다 이 두 가지가 제가 지킬 수 있는 최소 단위입니다.</p>
</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 이제 점심 후 졸음을 체력 문제로 넘기지 않기로 했습니다. 혈당은 체중이나 키와 달리 모르는 사람이 대부분인데, 제 몸 상태를 비춰주는 리트머스 시험지 같은 숫자였습니다.<br /><br />오늘 점심 드시고 눈꺼풀이 무거워지면 커피 대신 10분 산책을 먼저 시도해보시길 권합니다. 건강은 한 가지 음식이나 숫자가 아니라 매일 반복하는 습관 전체에서 만들어진다는 걸 이번에 다시 실감했습니다.<br /><br />이 글 읽고 오늘 식후에 한 번이라도 걸으셨다면 공감♥ 하나를 &#39;오늘 걸었다&#39;는 출석 도장으로 받겠습니다. 밥만 먹으면 졸린 날 다시 찾아오실 수 있게 구독해두시는 것도 방법입니다.</p>
