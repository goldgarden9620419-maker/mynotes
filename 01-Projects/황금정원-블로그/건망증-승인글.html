<script type="text/template" id="srcData">
<p class="lead-intro" data-ke-size="size16">치매는 기억이 지워지는 병일까요? 저는 당연히 그런 줄 알았습니다. 그런데 뇌과학 강의를 보니 초기 치매의 기억은 뇌 속 어딘가에 숨어 있을 뿐이라고 합니다. 냉장고 앞에서 뭘 꺼내려 했는지 잊는 일이 부쩍 늘어난 저에게는 귀가 번쩍 뜨이는 이야기였습니다.<br /><br />깜빡하는 뇌를 어떻게 지켜야 할지, 팩트와 제 실천을 나눠 정리해봤습니다.</p>
<p data-ke-size="size16"><br /><br /></p>

<section class="post-card">
<h2 data-ke-size="size26">뇌 속 기억은 단서를 기다리고 있었다</h2>
<div class="card-body">
<p data-ke-size="size16">일반적으로 깜빡하는 일이 잦아지면 치매부터 걱정하게 됩니다. 그런데 건망증과 치매는 작동 방식부터 다르다고 합니다. 건망증은 저장된 정보를 일시적으로 꺼내지 못하는 상태라 힌트를 주면 대부분 기억이 되살아납니다. 어제 만난 사람 이름이 안 떠오르다가 첫 글자를 듣는 순간 튀어나오는 경우가 여기에 해당합니다.<br /><br />더 놀라운 건 치매 초기도 비슷하다는 연구입니다. 인그램 셀 연구가 그 근거인데, 인그램 셀이란 하나의 기억이 저장될 때 함께 활성화된 신경 세포 무리를 가리키는 말로 흔히 기억 흔적 세포라고 부릅니다. 치매 동물의 사라진 줄 알았던 기억을 광유전학으로 자극했더니 다시 살아났습니다. 광유전학이란 빛으로 특정 신경 세포를 켜고 끄는 기술입니다. 치매 초기의 기억은 지워진 게 아니라 꺼낼 단서를 잃은 상태였던 겁니다.<br /><br />그 단서 중 가장 강력한 게 냄새입니다. 후각 세포는 기억과 감정을 다루는 변연계와 직통으로 연결되어 있어서 향 하나가 그때의 장면과 감정을 통째로 불러옵니다. 이걸 프루스트 효과라고 하는데, 홍차에 적신 과자 냄새로 어린 시절 기억을 되살린 소설가의 이름에서 온 표현입니다.<br /><br />후각은 경고등 역할도 합니다. 알츠하이머에서는 기억을 담당하는 해마보다 후각 담당 부위가 먼저 망가져서, 빠르면 판정 10년 전부터 신호가 나타난다고 합니다. 익숙한 냄새인데 관련된 기억이나 이름이 떠오르지 않으면 의심해볼 필요가 있습니다. 미국에서는 눈을 감고 한쪽 코씩 땅콩버터 냄새를 맡아보는 피넛 버터 테스트를 쓰는데, 왼쪽 코가 유난히 둔해졌을 때를 신호로 봅니다.<br /><br />참고: <a href="https://www.snuh.org/health/nMedInfo/nView.do?medid=AA001223" target="_blank" rel="noopener noreferrer">출처: 서울대학교병원 의학정보(건망증)</a></p>
<div class="summary-card"><b>요약:</b> 깜빡함 자체보다 익숙한 냄새를 못 알아보는 게 진짜 경고입니다. 초기 기억은 숨어 있을 뿐이라 단서만 있으면 찾을 수 있습니다.</div>
</div>

<section class="post-card">
<h2 data-ke-size="size26">오감을 쓰는 하루가 저의 예방법입니다</h2>
<div class="card-body">
<p data-ke-size="size16">기억이 숨는 거라면 찾기 쉽게 인식표를 많이 달아두면 됩니다. 눈으로만 읽은 기억보다 보고 듣고 쓰고 냄새까지 얹은 기억이 훨씬 오래가는 이유입니다. 뇌는 쓰지 않는 길을 폐허로 만들고 자주 다니는 길만 넓히는 기관이라, 한 가지 감각만 쓰는 쇼츠 시청 같은 활동만 반복하면 나머지 부위는 서서히 잠들게 됩니다.<br /><br />저도 어느 순간부터 나이 드는 걸 그냥 받아들이기보다 할 수 있는 걸 꾸준히 해보자는 쪽으로 생활을 바꿨습니다. 아침에 일찍 일어나 걷고 명상을 하고 책을 읽는 습관이 그렇게 시작됐습니다. 요즘은 블로그에 글을 쓰고 AI 공부도 하면서 잘 모르는 것들을 계속 배우고 있습니다. 솔직히 나이가 들수록 한 번 들었다고 바로 기억되지 않고 몇 번씩 다시 봐야 할 때도 많습니다. 그래도 이 반복 자체가 뇌에는 운동이 된다는 걸 알고 나니 포기할 이유가 없어졌습니다.<br /><br />걷기도 단순한 운동이 아니었습니다. 멍하니 걸을 때 뇌에서는 디폴트 모드 네트워크가 켜지는데, 이는 흐트러진 기억과 생각을 정리하는 뇌의 청소 회로 같은 것입니다. 밤의 숙면은 한 발 더 나아갑니다. 깊은 잠에 들었을 때만 글림프 시스템이 작동하는데, 글림프 시스템이란 뇌척수액이 신경 세포 사이를 씻어내며 치매 원인 물질로 알려진 아밀로이드 베타 같은 노폐물을 청소하는 배수 장치입니다. 잠을 줄이는 건 뇌 청소를 건너뛰는 셈입니다.<br /><br />다만 저는 치매가 무섭다고 억지로 새로운 걸 잔뜩 배워야 한다고 보지는 않습니다. 억지 도전은 오히려 스트레스가 되기 때문입니다. 거창한 계획보다 제가 할 수 있는 범위에서 꾸준히 하는 게 중요하다고 생각합니다. 제가 지키는 건 세 가지입니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">하루 한 번은 눈 말고 다른 감각을 하나 더 써서 기억한다 — 쓰면서 읽기, 향을 맡으며 정리하기</li>
<li data-ke-size="size16">내비게이션이나 쇼츠처럼 뇌를 대신 써주는 것들을 하루 한 번은 끄고 새 길로 가본다</li>
<li data-ke-size="size16">밤에는 뇌 청소 시간을 지킨다 — 야식과 휴대폰 대신 숙면</li>
</ul>
<p data-ke-size="size16">참고: <a href="https://www.amc.seoul.kr/asan/mobile/healthstory/medicalcolumn/medicalColumnDetail.do?medicalColumnId=33937" target="_blank" rel="noopener noreferrer">출처: 서울아산병원 메디컬칼럼(건망증과 치매)</a></p>
<div class="summary-card"><b>요약:</b> 오감으로 인식표를 달고, 뇌 대신 일해주는 도구를 하루 한 번 끄고, 숙면으로 뇌를 청소합니다. 거창한 도전보다 이 꾸준함이 저의 예방법입니다.</div>
</div>

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 깜빡할 때마다 치매 걱정하는 나, 유난인 걸까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 구분법을 알고 나니 걱정이 줄었습니다. 힌트를 들으면 기억이 되살아나는 건 대개 건망증이었습니다. 대신 익숙한 냄새가 낯설게 느껴지는지는 가끔 점검해보기로 했습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 이 나이에 새 공부, 너무 늦은 거 아니야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 해마는 어른이 되어서도 새 신경 세포를 만드는 유일한 곳이라고 합니다. 그러니 늦지 않았다고 저는 결론지었습니다. 몇 번씩 다시 봐야 외워지는 요즘의 공부도 그 자체로 뇌 운동이었습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 꼭 그렇게까지 새로운 걸 해야 해?</b></p>
<p class="faq-a" data-ke-size="size16">A. 억지로는 안 하기로 했습니다. 스트레스가 되면 역효과니까요. 새 길로 걸어보기, 새 향 맡아보기, 책 몇 페이지 읽기 정도면 충분하다는 게 제 판단입니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 오늘 밤 당장 뭐부터 할 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 휴대폰을 일찍 내려놓고 뇌 청소 시간을 지킬 겁니다. 자기 전에 오늘 배운 것 하나를 손으로 적어보려 합니다. 눈과 손을 같이 쓰면 인식표가 두 개 달리는 셈이니까요.</p>
</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 이제 깜빡하는 순간마다 겁먹는 대신 뇌에 인식표를 늘리는 쪽을 택했습니다. 오감을 섞어 기억하고, 뇌 대신 일해주는 도구를 가끔 끄고, 밤에는 뇌 청소 시간을 지키는 것. 나이를 핑계 삼지 않고 새로운 걸 조금씩 배우는 하루하루가 결국 기억을 지키는 길이라고 믿습니다.<br /><br />오늘 퇴근길엔 내비게이션을 끄고 새 길로 한번 돌아가보시길 권합니다. 뇌가 오랜만에 기분 좋게 일하는 느낌이 들 겁니다.<br /><br />다음에 또 깜빡하는 날 이 글의 위치까지 깜빡하지 않으시려면 구독해두시는 걸 권합니다. 공감♥ 하나는 제 뇌에 &#39;이 글 쓰길 잘했다&#39;는 단서로 남겨두겠습니다.</p>
<p data-ke-size="size16">참고: <a href="https://www.youtube.com/watch?v=kcie_y3MlBo" target="_blank" rel="noopener noreferrer">https://www.youtube.com/watch?v=kcie_y3MlBo</a></p>
</div>
