<p data-ke-size="size16" style="font-size:1.06rem;line-height:2;color:#1f2937;margin:0 0 10px 0;">자금 계획 보고서에서 숫자 실수 하나를 지적받은 날이었습니다. 저는 그날 퇴근할 때까지 어깨가 돌처럼 굳은 채 일했고, 모니터의 글자가 눈에 들어오지 않았습니다. &#39;왜 이것도 제대로 못 했지&#39;라는 말을 속으로 수십 번 반복하면서요.<br /><br />나중에야 알았습니다. 긴장과 불안은 뇌 속 경보 장치인 편도체가 켜지면서 나타나는 몸의 반응이고, 이 경보는 마음속 다짐 대신 몸의 힘 빼기로 꺼야 한다는 것을요. 긴장을 끄는 스위치가 어깨와 턱과 눈에 있었다는 이야기를 정리했습니다.</p>
<p data-ke-size="size16"><br /></p>
<h2 data-ke-size="size26" style="font-size:1.28rem;font-weight:700;color:#065f46;margin:38px 0 16px 0;"><span style="display:inline-block;background:#065f46;color:#ffffff;border-radius:6px;padding:2px 11px;margin-right:10px;font-size:0.92rem;vertical-align:2px;">01</span>긴장은 멧돼지 시대의 비상 시스템이었다</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">긴장할 때 몸에서 벌어지는 일은 생각보다 체계적입니다. 뇌가 생존에 위협이 될 만한 것을 감지하면 몸 전체를 전투 모드로 바꿉니다. 쓸 수 있는 에너지를 근육으로 몰아주려고 전체 에너지의 30% 이상을 쓰는 소화 기관의 기능을 낮추고, 뇌에서도 복잡한 사고를 맡는 전전두피질의 기능을 떨어뜨립니다. 포도당을 실어 나르느라 심장이 빨라지고 산소를 공급하느라 호흡이 가빠집니다. 구석기 시대에 멧돼지를 만났다면 더없이 유용한 시스템입니다.<br /><br />문제는 현대의 멧돼지가 5분 안에 사라지지 않는다는 점입니다. 수험생에게는 수학 시험지가 멧돼지고, 저에게는 상사의 지적 한마디가 멧돼지였습니다. 뇌는 둘을 구별하지 못해서 시험지 앞에서도 근육에 힘을 주고 사고 기능을 꺼버립니다. 집중력과 문해력이 떨어져 시험을 망치는 시험 불안이 이렇게 만들어집니다.<br /><br />실제로 가벼운 급성 스트레스만으로도 전전두피질의 인지 능력이 빠르고 극적으로 떨어진다는 연구가 있습니다. 전전두피질이란 이마 뒤쪽에서 집중과 판단, 작업 기억을 총괄하는 영역인데, 긴장하는 순간 가장 먼저 영양 공급이 끊기는 곳이기도 합니다. <a href="https://pubmed.ncbi.nlm.nih.gov/19455173/" target="_blank" rel="noopener noreferrer" style="color:#047857;text-decoration:underline;">출처: Nature Reviews Neuroscience(PubMed)</a> 제가 지적받은 날 보고서 글자가 눈에 안 들어왔던 게 의지 부족 때문만은 아니었던 겁니다.</p>
<div style="background:#f0fdf4;border:1px solid #a7f3d0;border-radius:10px;padding:13px 16px;margin:18px 0 8px 0;font-size:0.95rem;line-height:1.8;color:#065f46;"><b>요약</b> · 긴장은 뇌가 위협을 감지해 소화와 사고 기능을 끄고 에너지를 근육으로 몰아주는 생존 시스템이다. 가벼운 급성 스트레스만으로도 집중과 판단을 맡는 전전두피질의 기능이 급격히 떨어진다는 연구가 있다.</div>
<h2 data-ke-size="size26" style="font-size:1.28rem;font-weight:700;color:#065f46;margin:38px 0 16px 0;"><span style="display:inline-block;background:#065f46;color:#ffffff;border-radius:6px;padding:2px 11px;margin-right:10px;font-size:0.92rem;vertical-align:2px;">02</span>편도체는 말로 설득되지 않았다</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">이 경보 장치의 이름이 편도체입니다. 편도체란 뇌 깊숙한 곳에서 위험 신호에 즉각 반응하는 비상벨 같은 부위로, 의식이 닿지 않는 무의식의 영역에서 작동합니다. 그래서 긴장될 때 속으로 &#39;진정하자, 침착하자&#39;를 외쳐도 소용이 없었던 겁니다. 벨은 말을 못 알아듣습니다.<br /><br />다행히 뒷문이 하나 있습니다. 우리 몸의 신경 대부분은 척추를 거쳐 뇌로 가는데, 극히 일부는 뇌와 직통으로 연결돼 있습니다. 어깨를 으쓱하게 만드는 승모근, 고개를 돌릴 때 드러나는 흉쇄유돌근, 이를 악무는 턱 근육, 눈동자와 표정 근육이 그렇습니다. 이 근육들은 감정과 직결돼 있어서 주먹을 꽉 쥐고 인상을 쓰고 어깨를 끌어올리면 편도체가 거꾸로 켜집니다.<br /><br />여기서 발상이 뒤집힙니다. 연결이 양방향이라면 이 근육들의 힘을 빼는 것으로 편도체에 &#39;지금 위기 상황이 없다&#39;는 신호를 보낼 수 있다는 겁니다. 마음이 몸을 못 바꾸니 몸으로 마음에 신호를 보내는 쪽을 택하는 거죠. 저는 이 대목에서 무릎을 쳤습니다. 수십 년 동안 반대 방향으로만 애써왔으니까요.</p>
<div style="background:#f0fdf4;border:1px solid #a7f3d0;border-radius:10px;padding:13px 16px;margin:18px 0 8px 0;font-size:0.95rem;line-height:1.8;color:#065f46;"><b>요약</b> · 편도체는 무의식 영역의 경보 장치라서 말로 진정시킬 수 없다. 대신 승모근, 턱 근육, 눈과 표정 근육처럼 뇌와 직통으로 연결된 근육의 힘을 빼면 편도체에 위기가 지나갔다는 신호를 보낼 수 있다.</div>
<h2 data-ke-size="size26" style="font-size:1.28rem;font-weight:700;color:#065f46;margin:38px 0 16px 0;"><span style="display:inline-block;background:#065f46;color:#ffffff;border-radius:6px;padding:2px 11px;margin-right:10px;font-size:0.92rem;vertical-align:2px;">03</span>바보 표정 힘빼기 연습을 시작했다</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">방법은 민망할 만큼 단순합니다. 어깨를 툭 떨어뜨리고, 아래턱의 힘을 빼서 입이 살짝 벌어지게 두고, 눈에 준 힘을 풀고, 당기고 있던 배를 놓아줍니다. 거울로 보면 영락없이 멍한 바보 표정입니다. 그런데 이게 현자의 표정이라고 합니다. 반대로 눈에 힘을 딱 주고 이를 악문 똑똑해 보이는 표정이 사실은 편도체를 켜는 표정이었습니다.<br /><br />배를 풀어주는 대목이 저는 제일 와닿았습니다. 두려우면 배가 조여들고, 두려움 없는 사람을 우리가 배짱이 두둑하다고 부르는 게 우연이 아니었던 겁니다. 제 루틴은 이렇게 정리했습니다.</p>
<ul style="list-style-type:disc;margin:12px 0 16px 24px;padding:0;" data-ke-list-type="disc">
<li data-ke-size="size16" style="margin:6px 0;line-height:1.85;color:#374151;font-size:1rem;">긴장이 느껴지면 어깨부터 툭 내리고 턱과 눈과 배의 힘을 차례로 빼기</li>
<li data-ke-size="size16" style="margin:6px 0;line-height:1.85;color:#374151;font-size:1rem;">중요한 보고나 발표 전에 &#39;침착하고 차분하게, 즐거운 마음으로, 나는 할 수 있다&#39;를 천천히 반복하기 — 올림픽 양궁 선수들이 썼다는 그 문장입니다</li>
<li data-ke-size="size16" style="margin:6px 0;line-height:1.85;color:#374151;font-size:1rem;">하루 한 번, 아무것도 안 하고 멍하니 있어도 쫓기지 않는 시간을 5분 갖기</li>
</ul>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">만트라 문장이 두 부분으로 설계돼 있다는 점도 흥미로웠습니다. 앞부분은 경보를 끄는 말이고 뒷부분은 집중을 켜는 말입니다. 긴장을 낮추는 일과 집중을 올리는 일이 별개의 훈련이라는 거죠. 이런 이완 훈련은 국가정신건강정보포털에서도 불안 관리법으로 안내하고 있습니다. <a href="https://www.mentalhealth.go.kr/" target="_blank" rel="noopener noreferrer" style="color:#047857;text-decoration:underline;">출처: 국가정신건강정보포털</a></p>
<div style="background:#f0fdf4;border:1px solid #a7f3d0;border-radius:10px;padding:13px 16px;margin:18px 0 8px 0;font-size:0.95rem;line-height:1.8;color:#065f46;"><b>요약</b> · 어깨를 내리고 턱과 눈과 배의 힘을 빼는 멍한 표정이 편도체를 끄는 자세다. 긴장을 낮추는 힘빼기와 집중을 올리는 자기 긍정 문장을 함께 쓰면 중요한 순간에 실력을 발휘하기 쉬워진다.</div>
<h2 data-ke-size="size26" style="font-size:1.28rem;font-weight:700;color:#065f46;margin:38px 0 16px 0;"><span style="display:inline-block;background:#065f46;color:#ffffff;border-radius:6px;padding:2px 11px;margin-right:10px;font-size:0.92rem;vertical-align:2px;">04</span>저에게도 &#39;그럴 수도 있지&#39;를 주기로 했다</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">몸의 힘을 빼는 연습을 하다 보니 마음에 힘이 들어가 있던 자리도 보였습니다. 저는 동료가 실수하면 &#39;그럴 수도 있지&#39;라고 쉽게 말하면서 정작 저 자신에게는 그 말을 해준 적이 거의 없었습니다. 일을 잘해야 인정받고 인정받아야 제 가치가 있다고 믿으며 살았으니, 실수 하나에 하루 종일 저를 몰아붙인 것도 당연한 수순이었습니다.<br /><br />그런데 인정 욕구에는 끝이 없었습니다. 아무리 인정받아도 만족은 오래가지 못했고 더 잘해야 한다는 긴장만 쌓였습니다. 그래서 요즘은 순서를 바꿨습니다. 실수한 날엔 어깨를 내리면서 속으로 한마디를 보탭니다. &#39;고생했다, 그럴 수도 있지.&#39; 베스트 프렌드에게 해주던 말을 저에게 먼저 해주는 겁니다.<br /><br />진짜 강한 사람은 항상 잘하는 사람이 아니라 실패하고 부족한 모습까지 자기 삶의 일부로 받아들이는 사람이라고 저는 생각합니다. 몸의 힘빼기와 마음의 힘빼기는 결국 한 세트였습니다.</p>
<div style="background:#f0fdf4;border:1px solid #a7f3d0;border-radius:10px;padding:13px 16px;margin:18px 0 8px 0;font-size:0.95rem;line-height:1.8;color:#065f46;"><b>요약</b> · 타인에게는 관대하면서 자신에게만 가혹한 습관은 긴장을 만성화시킨다. 실수한 날 어깨를 내리며 자신에게 &#39;그럴 수도 있지&#39;라고 말해주는 연습이 몸의 힘빼기와 한 세트다.</div>
<h2 data-ke-size="size26" style="font-size:1.28rem;font-weight:700;color:#065f46;margin:38px 0 16px 0;"><span style="display:inline-block;background:#065f46;color:#ffffff;border-radius:6px;padding:2px 11px;margin-right:10px;font-size:0.92rem;vertical-align:2px;">05</span>제가 저에게 던진 질문들</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.85;color:#065f46;margin:22px 0 6px 0;"><b>Q. 긴장될 때 심호흡만 하면 되는 거 아니었어?</b></p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.9;color:#374151;margin:0 0 4px 0;">A. 심호흡도 도움이 되지만 저한테는 절반짜리였습니다. 숨을 고르면서도 어깨와 턱은 그대로 굳어 있었으니까요. 뇌와 직통인 근육의 힘을 함께 빼야 편도체에 신호가 제대로 간다는 걸 이번에 배웠습니다.</p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.85;color:#065f46;margin:22px 0 6px 0;"><b>Q. 힘을 빼면 늘어져서 일을 망치지 않을까?</b></p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.9;color:#374151;margin:0 0 4px 0;">A. 반대였습니다. 편도체가 켜져 있는 동안은 집중을 맡는 전전두피질이 꺼져 있어서 오히려 실수가 늘었습니다. 경보를 꺼야 집중이 돌아온다는 게 핵심이라서, 저에게 힘빼기는 집중을 되찾는 기술에 가까웠습니다.</p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.85;color:#065f46;margin:22px 0 6px 0;"><b>Q. 만트라 외우는 거, 좀 민망하지 않아?</b></p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.9;color:#374151;margin:0 0 4px 0;">A. 저도 처음엔 속는 셈 치고 했습니다. 소리 내지 않고 속으로 천천히 반복하면 아무도 모릅니다. 세계 1등 양궁 선수들이 시합장에서 쓰는 문장이라는 걸 떠올리면 민망함보다 든든함이 커졌습니다.</p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.85;color:#065f46;margin:22px 0 6px 0;"><b>Q. 내일 또 실수를 지적받으면 어떻게 할 거야?</b></p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.9;color:#374151;margin:0 0 4px 0;">A. 첫 동작은 정해뒀습니다. 어깨를 툭 내리고 배를 풀고 속으로 &#39;그럴 수도 있지&#39;를 한 번 말할 겁니다. 그 다음에 지적받은 내용만 고치면 됩니다. 실수를 고치는 일과 저를 깎아내리는 일을 분리하는 게 이번 연습의 전부입니다.</p>
<h2 data-ke-size="size26" style="font-size:1.28rem;font-weight:700;color:#065f46;margin:38px 0 16px 0;"><span style="display:inline-block;background:#065f46;color:#ffffff;border-radius:6px;padding:2px 11px;margin-right:10px;font-size:0.92rem;vertical-align:2px;">06</span>결론</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">저는 이제 긴장을 의지의 문제로 보지 않습니다. 편도체라는 오래된 경보 장치가 울리는 것뿐이고, 그 벨을 끄는 스위치는 어깨와 턱과 눈과 배에 있었습니다.<br /><br />오늘 뭔가에 긁히고 굳어 있는 분이라면 지금 바로 어깨를 툭 내려보시길 권합니다. 돈도 시간도 들지 않는 3초짜리 스위치입니다.<br /><br />이 글을 읽는 동안 자기도 모르게 올라가 있던 어깨가 내려갔다면 그걸로 충분합니다. 공감♥ 하나는 &#39;오늘 어깨 내렸다&#39;는 신호로 받겠습니다. 긴장이 풀리지 않는 날 다시 오실 수 있게 구독해두시면 다음 스위치도 준비해두겠습니다.</p>
