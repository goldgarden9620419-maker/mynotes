<p class="lead-intro" data-ke-size="size16">일요일 밤 불을 끄고 누웠는데 머릿속만 환하게 켜지는 날 있으시죠. &#39;다음 주에 그 일이 틀어지면 어쩌지&#39;, &#39;그때 그 말은 실수 아니었을까&#39;. 저도 그런 밤이 많았습니다. 회사에 중요한 일이 있거나 관계가 조금 불편해지면 집에 와서도 그 장면을 계속 돌려봤습니다.<br /><br />그런데 걱정을 일기로 추적한 연구에서 걱정의 91%는 실제로 일어나지 않았다고 합니다. 제 밤들을 갉아먹던 걱정의 정체를 정리해봤습니다.</p>
<p data-ke-size="size16"><br /><br /></p>

<section class="post-card">
<h2 data-ke-size="size26">걱정은 대부분 착각으로 끝났다</h2>
<div class="card-body">
<p data-ke-size="size16">수치부터 보겠습니다. 불안 증상이 있는 사람들에게 걱정이 떠오를 때마다 기록하게 하고 그 일이 실제로 일어났는지 한 달간 추적한 연구가 있습니다. 결과는 평균 91.4%의 걱정이 현실이 되지 않았다는 것이었습니다. 열에 아홉은 머릿속에서만 벌어진 일이었던 셈입니다. 제 경험도 다르지 않았습니다. 머릿속으로 최악의 상황까지 만들어내며 밤을 보냈지만 지나고 보면 걱정했던 일의 대부분은 일어나지 않았고, 막상 문제가 생겨도 그때 가서 해결되는 경우가 많았습니다.<br /><br />그런데 왜 이렇게 빗나가는 걱정을 계속하게 될까요. 최악의 수를 생각하는 데는 숨은 이득이 있다고 합니다. 최악을 그려두면 뭔가 대비하는 기분이 들고, 일이 끝나면 &#39;최악을 생각해둔 덕에 이만큼 한 거야&#39;라는 보상까지 따라옵니다. 이 이득 때문에 걱정이 습관으로 굳습니다. 여기에 반추가 얹어집니다. 반추란 지나간 일이나 오지 않은 일을 소가 되새김질하듯 계속 곱씹는 사고 방식을 말합니다.<br /><br />문제는 악순환입니다. 미리 걱정하면 불안이 높아지고, 높아진 불안이 다시 걱정을 부릅니다. 이 고리를 돌다 보면 생각은 자동 조종 사고로 넘어갑니다. 자동 조종 사고란 늘 하던 방식대로 저절로 재생되는 생각의 회로를 가리키는데, 사람들을 만나고 온 밤 &#39;내가 말실수했나&#39;부터 트는 게 딱 그것이었습니다. 이 정도가 일상에 지장을 줄 만큼 커지면 진료가 필요한 단계로 넘어간다고 합니다.<br /><br />참고: <a href="https://pubmed.ncbi.nlm.nih.gov/32402257/" target="_blank" rel="noopener noreferrer">출처: LaFreniere &amp; Newman, Behavior Therapy(2020)</a></p>
<div class="summary-card"><b>요약:</b> 추적해보니 걱정의 91%는 일어나지 않았습니다. 최악을 그리는 습관은 대비의 착각과 반추의 악순환으로 굴러갑니다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">할 수 있는 일과 떠난 일을 구분합니다</h2>
<div class="card-body">
<p data-ke-size="size16">요즘 저는 걱정이 올라오면 질문 하나를 먼저 던집니다. &#39;이거 지금 내가 할 수 있는 일인가?&#39; 할 수 있는 일이면 행동으로 옮기고, 이미 제 손을 떠난 일이면 붙잡지 않으려 합니다. 상대가 저를 어떻게 볼지, 지나간 말이 어떻게 들렸을지는 생각한다고 바뀌지 않는 영역이었습니다. 중요한 건 걱정을 없애는 게 아니라 바꿀 수 있는 것과 없는 것을 구분하는 것이라고 저는 정리했습니다.<br /><br />밤에 커지는 걱정에는 기록이 잘 들었습니다. 인지 행동 기법의 한 방식인데, 인지 행동 기법이란 생각을 종이에 꺼내놓고 사실과 대조하며 감정 반응을 바꿔가는 심리 치료 방법입니다. 제가 예상하는 최악의 결과를 다 적고, 그 일이 실제로 벌어질 확률을 숫자로 써봅니다. 적어보면 확률은 늘 민망할 만큼 작았습니다. 여백에는 일이 수월하게 풀릴 가능성도 적어둡니다. 머릿속에서 굴릴 때보다 걱정의 실체가 또렷해지면서 크기가 줄어듭니다.<br /><br />타인의 시선 걱정에는 7 대 2 대 1 법칙이 약이 됐습니다. 주변에 열 명이 있으면 일곱은 저에게 무관심하고 둘은 이유 없이 싫어하고 하나는 이유 없이 좋아한다는 이야기입니다. 다들 자기 생각을 하느라 저에게 관심이 없었습니다. 저 혼자 심사위원단 앞에 선 기분으로 살았던 겁니다.<br /><br />다만 저는 &#39;신경 쓰지 마라&#39;, &#39;내일 걱정은 내일 하면 된다&#39;는 말만으로는 부족하다고 생각합니다. 걱정 덕분에 미리 준비하고 실수를 줄이는 부분도 분명 있기 때문입니다. 그래서 걱정을 통째로 버리기보다 준비로 이어지는 걱정만 남기기로 했습니다. 제 기준은 세 가지입니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">걱정이 떠오르면 &#39;지금 내가 할 수 있는 일인가&#39;부터 묻는다 — 있으면 행동, 없으면 내려놓기</li>
<li data-ke-size="size16">밤에 커지는 걱정은 종이에 적고 실제로 일어날 확률을 숫자로 써본다</li>
<li data-ke-size="size16">곱씹기가 시작되면 정해둔 도구로 끊는다 — 노래 한 곡, 집 앞 한 바퀴</li>
</ul>
<p data-ke-size="size16">의지로 생각을 끊는 건 잘 안 됩니다. 도구를 미리 정해두는 쪽이 저에게는 훨씬 현실적이었습니다.<br /><br />참고: <a href="https://www.mentalhealth.go.kr/" target="_blank" rel="noopener noreferrer">출처: 국가정신건강정보포털(보건복지부·국립정신건강센터)</a></p>
<div class="summary-card"><b>요약:</b> 걱정은 없애는 대상보다 골라내는 대상입니다. 할 수 있는 일만 남기고, 밤의 걱정은 종이에 적어 크기를 확인합니다.</div>
</div>

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 걱정이 많은 나, 어딘가 문제가 있는 걸까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 걱정 자체는 자연스러운 과정이라고 배웠습니다. 관건은 정도였습니다. 일상에 지장을 줄 만큼 커졌다면 혼자 버티기보다 상담이나 진료를 받는 것도 방법이라고 저는 받아들였습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 최악을 미리 생각해두는 게 대비 아니야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 저도 오래 그렇게 믿었습니다. 그런데 대비는 행동으로 이어질 때만 대비였습니다. 준비 없이 상상만 반복된다면 그건 감정 소비라는 게 지금의 제 판단입니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 사람들 만나고 온 밤, 말실수를 곱씹게 되면?</b></p>
<p class="faq-a" data-ke-size="size16">A. 그건 제 손을 떠난 문제라고 소리 내어 말해봅니다. 평소 자기 검열이 심한 사람일수록 실제로 실수했을 확률은 낮다고 합니다. 그래도 남는 마음은 가까운 사람에게 물어보는 쪽이 혼자 굴리는 것보다 나았습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 오늘 밤 당장 뭐부터 해볼 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 지금 안고 있는 걱정 두 개를 적고 옆에 일어날 확률을 써볼 겁니다. 그리고 다음 주 일 걱정이 올라오면 &#39;월요일에 출근해서 걱정하자&#39;로 미뤄두고 이번 주말을 지키려 합니다.</p>
</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 이제 걱정 없는 사람이 되겠다는 목표를 버렸습니다. 대신 걱정을 골라냅니다. 지금 할 수 있는 일이면 움직이고, 손을 떠난 일이면 종이에 적어 크기를 확인하고 내려놓습니다. 미래를 걱정하느라 오늘을 흘려보내는 것보다 오늘 할 수 있는 일에 집중하는 게 결국 더 나은 미래를 만든다고 믿게 됐습니다.<br /><br />오늘 밤 걱정이 머리를 켜면 종이 한 장을 꺼내보시길 권합니다. 적는 순간부터 걱정은 안개에서 글자가 되고, 글자가 된 걱정은 생각보다 작습니다.<br /><br />다음에 또 걱정이 밤을 점령하는 날 이 글을 찾아 헤매지 않으시려면 구독해두시는 걸 권합니다. 사실 &#39;이 글이 도움이 될까&#39;라는 걱정을 적어둔 게 있는데, 공감♥ 하나면 그 걱정도 일어나지 않은 91%로 기록해두겠습니다.</p>
<p data-ke-size="size16">참고: <a href="https://www.youtube.com/watch?v=gFYp4JmJlDI" target="_blank" rel="noopener noreferrer">https://www.youtube.com/watch?v=gFYp4JmJlDI</a></p>
</div>
