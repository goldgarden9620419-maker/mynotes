<p class="lead-intro" data-ke-size="size16">솔직히 고백하면 저는 &#39;취미가 뭐예요?&#39;라는 질문이 늘 곤란했습니다. 운동이나 독서라고 답하긴 했지만 즐긴다기보다 해야 해서 하는 일에 가까웠고, 뭔가에 푹 빠져 있는 사람들이 부러웠습니다. 남들에게 말했을 때 그럴듯해 보이는 취미 하나쯤 있었으면 했습니다.<br /><br />그런데 요즘 생각이 바뀌었습니다. 취미까지 잘해야 할 필요가 있을까. 그 물음에서 시작한 이야기를 정리해봤습니다.</p>
<p data-ke-size="size16"><br /><br /></p>

<section class="post-card">
<h2 data-ke-size="size26">취미에 허세가 끼어 있었다</h2>
<div class="card-body">
<p data-ke-size="size16">돌아보니 문제는 취미가 없는 게 아니었습니다. 취미의 기준이 너무 높았던 겁니다. 남들 입에서 &#39;멋지다&#39;가 나올 만큼 우아하고 전문적이어야 취미로 쳐주는 분위기가 있습니다. 등산이라 말하려면 정상 등반 경험이 쌓여 있어야 할 것 같고, 커피가 취미라면 드립 정도는 내려야 할 것 같은 압박입니다.<br /><br />여기에 경쟁까지 얹어집니다. 러닝을 하면 거리와 기록을 비교하고, 골프를 하면 장비와 실력을 따지고, 독서를 해도 몇 권 읽었는지가 중요해집니다. 좋아서 시작한 일이 어느 순간 사회적 비교의 무대가 되는 겁니다. 사회적 비교란 남과 견주어 자기 위치를 평가하려는 심리를 말하는데, 직장에서 충분히 하고 있는 이 비교를 쉬는 시간까지 끌고 들어오는 셈입니다.<br /><br />성과 강박도 따라옵니다. 꾸준히 해야 하고 가능하면 자격증을 따거나 수익까지 내야 제대로 된 취미로 인정받는 분위기 말입니다. 이쯤 되면 취미는 휴식이기를 멈추고 또 하나의 숙제가 됩니다. 쉬라고 있는 시간에 완벽한 계획을 세우고 장비를 검색하며 스트레스를 받는다면, 이미 재미와는 멀어진 뒤입니다. 저 역시 있어 보이는 취미를 찾느라 정작 즐거움을 놓치고 있었습니다.</p>
<div class="summary-card"><b>요약:</b> 취미가 없는 게 문제가 아니었습니다. 우아해야 하고 비교에서 이겨야 하고 성과까지 내야 한다는 기준이 취미를 숙제로 만들고 있었습니다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">즐거움이 전부라는 기준</h2>
<div class="card-body">
<p data-ke-size="size16">사전을 찾아보면 취미는 전문적으로 하는 일이 아니고 즐기기 위하여 하는 일이라고 되어 있습니다. 정의 어디에도 잘해야 한다거나 남에게 보여줘야 한다는 말이 없습니다. 잘할 필요가 애초에 없었던 겁니다.<br /><br />건강 근거도 있습니다. 성인 1,399명을 조사한 연구에서 즐거운 여가 활동에 많이 참여하는 사람일수록 혈압이 낮고 코르티솔 수치도 낮았으며 심리 상태도 좋았습니다. 코르티솔이란 스트레스를 받을 때 분비되는 호르몬으로, 만성적으로 높으면 몸 곳곳에 부담을 줍니다. 핵심은 활동의 격이 높아서가 아니고 본인이 즐거워하는 활동이 많다는 데 있었습니다.<br /><br />제 취미인지 허세인지 가르는 기준도 간단했습니다. 그 활동을 할 때 남들이 어떻게 볼지 신경 쓰이는지, 더 좋은 장비와 기술이 있어야 한다는 압박이 드는지 물어보는 겁니다. 둘 중 하나라도 그렇다면 취미일 수는 있어도 즐거움은 되기 어렵습니다. 하루 15분 동네 천변을 공유 자전거로 달리며 아이스크림 하나 사 먹는 사람이, 풀 세팅 장비를 갖추고도 남의 시선에 시달리는 사람보다 취미의 본질에는 가까울 수 있다는 이야기입니다.<br /><br />참고: <a href="https://pubmed.ncbi.nlm.nih.gov/19592515/" target="_blank" rel="noopener noreferrer">출처: Pressman et al., Psychosomatic Medicine(2009)</a></p>
<div class="summary-card"><b>요약:</b> 취미의 사전 정의에는 &#39;잘해야 한다&#39;가 없습니다. 즐거운 여가가 많은 사람일수록 혈압과 스트레스 호르몬이 낮았습니다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">이미 즐기는 것을 관찰하는 일</h2>
<div class="card-body">
<p data-ke-size="size16">기준을 바꾸고 나서 제 일상을 관찰해봤습니다. 저는 아침에 걷는 시간을 좋아합니다. 책을 읽다가 마음에 드는 문장을 발견하는 순간을 좋아하고, 블로그에 생각을 정리해 올리는 일도 어느 순간부터 자연스럽게 계속하고 있습니다. 예전에는 이런 것들을 취미로 치지 않았습니다. 너무 평범하고 특별할 게 없다고 여겼기 때문입니다.<br /><br />지금은 다르게 봅니다. 중요한 건 남들이 어떻게 보느냐가 아니라 제가 그 시간을 좋아하느냐였습니다. 돈이 되지 않아도, 실력이 늘지 않아도 그 시간이 기다려지고 편안하다면 충분히 취미였습니다. 어쩌면 새로운 취미를 찾는 것보다 이미 즐기고 있는 것을 알아차리는 게 먼저인지도 모릅니다. 번아웃을 막는 휴식도 결국 이런 시간에서 나옵니다. 번아웃이란 에너지가 바닥나 일도 일상도 무기력해지는 소진 상태를 말하는데, 쉬는 시간까지 성과로 채우는 사람일수록 가까워지기 쉽습니다.<br /><br />그래서 요즘 제가 지키는 건 세 가지입니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">일주일간 내가 자주 웃고 기다리게 되는 순간을 적어본다 — 답은 대개 일상에 이미 있다</li>
<li data-ke-size="size16">취미에서는 기록, 장비, 권수를 세지 않는다 — 비교가 시작되면 잠시 멈춘다</li>
<li data-ke-size="size16">누가 취미를 물으면 부풀리지 않고 그대로 말한다 — &#39;아침에 걷고 좋은 문장 모으는 게 취미예요&#39;</li>
</ul>
<p data-ke-size="size16">참고: <a href="https://www.mentalhealth.go.kr/" target="_blank" rel="noopener noreferrer">출처: 국가정신건강정보포털(보건복지부·국립정신건강센터)</a></p>
<div class="summary-card"><b>요약:</b> 새 취미를 찾기 전에 이미 좋아하는 시간을 알아차리는 게 먼저입니다. 기다려지는 시간이 있다면 그게 취미입니다.</div>
</div>
</section>
<br />

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 걷기랑 독서가 취미라고 하면 너무 시시해 보이지 않을까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 시시하게 보는 건 남의 기준이었습니다. 제 기준은 그 시간이 기다려지는가 하나로 정했습니다. 기다려지는 시간을 시시하다고 부를 이유가 없다고 저는 결론지었습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 취미로 돈도 벌 수 있으면 더 좋은 거 아니야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 벌리면 좋겠지만 그걸 목표로 삼는 순간 취미는 일이 됐습니다. 저에게는 성과 없이도 즐거운 시간이 하나쯤 남아 있어야 나머지 삶이 버텨진다는 게 경험에서 나온 답입니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 좋아하는 게 정말 하나도 안 떠오르면 어떡할 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 그럴 땐 일주일만 저를 관찰하기로 했습니다. 언제 웃었는지, 어떤 시간이 빨리 갔는지 적어보는 겁니다. 특별한 걸 새로 시작하기보다 이미 있는 즐거움부터 찾아볼 생각입니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 오늘 당장 뭐부터 해볼 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 오늘 저녁 수첩에 &#39;기다려지는 시간&#39; 목록을 만들어볼 겁니다. 아침 걷기와 좋은 문장 수집이 첫 줄에 들어갈 것 같습니다. 그리고 다음에 취미를 물어보는 사람에게는 부풀리지 않고 이 목록을 그대로 말하려 합니다.</p>
</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 이제 멋진 취미를 찾는 일을 그만뒀습니다. 대신 이미 좋아하고 있던 시간들에 취미라는 이름을 붙여줬습니다. 못해도 되고 발전하지 않아도 되고 보여주지 않아도 되는 시간. 그 시간이 있어야 직장과 일상의 경쟁을 버틸 힘이 생긴다는 걸 이제는 압니다.<br /><br />오늘 하루를 돌아보며 기다려졌던 순간 하나를 찾아보시길 권합니다. 그게 남들 눈에 아무리 사소해 보여도 당신을 즐겁게 했다면 이미 훌륭한 취미입니다.<br /><br />다음에 누가 취미를 물어 곤란해지는 날 이 글을 찾아 헤매지 않으시려면 구독해두시는 걸 권합니다. 공감♥ 하나는 제 &#39;기다려지는 시간&#39; 목록에 한 줄로 올려두겠습니다.</p>
<p data-ke-size="size16">참고: <a href="https://www.youtube.com/watch?v=wpIG61jKCMY" target="_blank" rel="noopener noreferrer">https://www.youtube.com/watch?v=wpIG61jKCMY</a></p>
</div>
</section>
