<p class="lead-intro" data-ke-size="size16" style="font-size:1.05rem;line-height:1.95;color:#1f2937;margin:0 0 10px 0;">거절 못하는 사람은 자존감이 낮아서 그렇다고 흔히 알려져 있습니다. 그런데 정말 그럴까요? 저는 이 통념을 뒤집는 이야기를 접하고 나서야, 제가 왜 그렇게 부탁을 거절하지 못했는지 이해하게 됐습니다.<br /><br />거절하는 법과 경계 설정을 다시 들여다보면서 제가 직접 적용해보고 정리한 내용을 남겨봅니다.</p>

<h2 data-ke-size="size26" style="font-size:1.3rem;font-weight:700;color:#1e3a8a;margin:0;padding:18px 22px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-bottom:1px solid #e5e7eb;">거절 못하는 건 성격이 아니라 방식 문제다</h2>
<div class="card-body" style="padding:20px 22px;">
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 14px 0;">일반적으로 거절을 못 하는 이유는 자존감이 낮아서라고 알려져 있습니다. 그런데 제가 접한 자료에서는 다른 설명을 제시했습니다. 거절을 잘 못하는 사람일수록 오히려 공감 능력이 높은 경우가 많아서, 상대의 상황과 감정이 지나치게 선명하게 느껴져 거절을 주저하게 된다는 겁니다. 이런 패턴이 반복되면 착한아이콤플렉스로 이어질 수 있는데, 착한아이콤플렉스란 주변의 기대에 맞추기 위해 자신의 감정을 억누르고 항상 좋은 사람으로 보이려 하는 심리적 경향을 뜻합니다.<br /><br />대인관계에서 오는 스트레스가 자아존중감에도 영향을 미친다는 연구 결과가 있습니다(<a href="https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART002535635" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;">출처: 한국학술지인용색인(KCI) 논문</a>). 국가정신건강정보포털에서도 반복되는 대인관계 스트레스가 정신 건강에 부정적인 영향을 줄 수 있다고 안내합니다(<a href="https://www.mentalhealth.go.kr/portal/disease/diseaseDetail.do?dissId=30&srCodeNm=Stress" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;">출처: 국가정신건강정보포털</a>). 저는 이 설명을 읽고 나서야, 제가 부탁을 거절하지 못했던 게 의지가 약해서가 아니라 남을 배려하는 마음이 컸기 때문이라는 걸 인정하게 됐습니다. 그동안은 거절 못하는 저 자신을 계속 고쳐야 할 결점처럼 여겼는데, 문제는 성격이 아니라 그 성격을 다루는 방식에 있었다는 걸 알고 나니 마음이 한결 가벼워졌습니다.</p>

<div class="card-body" style="padding:20px 22px;">
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 14px 0;">저는 회사에서 동료가 도움을 요청하면 제 일이 밀려 있어도 먼저 해결해 주려고 했고, 가까운 사람의 부탁은 제가 조금 힘들더라도 들어주는 게 좋은 관계를 유지하는 방법이라고 생각했습니다. 그런데 이런 일이 반복되다 보니 정작 제가 해야 할 일에 집중하지 못하거나, 혼자 지쳐서 왜 저만 이렇게까지 해야 하는지 억울한 생각이 들 때도 있었습니다.<br /><br />범위와 시간을 조율하는 방식은 확실히 도움이 됐습니다. 전부는 어렵지만 이 부분은 도와줄 수 있다고 말하는 것만으로도, 부탁을 딱 잘라 거절하는 것보다 훨씬 부드럽게 전달됐습니다. 다만 저는 거절을 못 하는 이유가 전부 공감 능력 때문이라는 설명에는 조금 거리를 두고 싶습니다. 갈등에 대한 두려움, 인정받고 싶은 욕구, 관계가 멀어질 것 같은 불안처럼 다른 이유도 얼마든지 있을 수 있습니다.<br /><br />또한 반복적으로 호의를 당연하게 여기거나 제 경계를 무시하는 사람에게는 조율만으로 해결되지 않는다는 것도 저는 겪어봤습니다. 처음 한두 번은 범위를 정해서 도와줬는데도, 시간이 지나자 그 정도는 당연히 해주는 걸로 여기고 더 큰 부탁을 아무렇지 않게 꺼내는 경우가 있었습니다. 그럴 때는 아무리 부드럽게 조율해도 상대가 제 경계를 계속 넘어왔습니다. 그런 상대에게는 조율이 아니라 분명한 거절이 필요하다고 저는 생각합니다.</p>

<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 14px 0;">저는 거절을 못하는 게 성격 문제가 아니라 방식의 문제라는 걸 인정하게 됐습니다. 범위와 시간을 조율하는 것만으로 많은 관계가 훨씬 편해졌습니다. 다만 조율조차 통하지 않는 사람 앞에서는 분명한 경계가 필요하다는 것도 함께 배웠습니다.<br /><br />다음에 부탁을 받으면, 바로 대답하기 전에 저에게 감당할 수 있는 범위가 어디까지인지 먼저 생각해보시길 권합니다.</p>

<script>
var src = document.getElementById('src').textContent.trim();
document.getElementById('preview').innerHTML = src;
document.getElementById('htmlBox').value = src;
function copyText(id, btn) {
  var t = document.getElementById(id).textContent;
  doCopy(t, btn);
}
function copyBody(btn) {
  var box = document.getElementById('htmlBox');
  box.select();
  doCopy(box.value, btn);
}
function doCopy(text, btn) {
  var done = function() {
    var old = btn.textContent;
    btn.textContent = '복사 완료!';
    setTimeout(function(){ btn.textContent = old; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text); done();
  }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}
</script>
