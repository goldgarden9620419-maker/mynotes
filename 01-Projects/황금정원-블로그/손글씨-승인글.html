<p class="lead-intro" data-ke-size="size16">퇴근하고 책상에 앉아 열심히 책장을 넘겼는데, 며칠 뒤에 그 책 내용을 물으면 아무것도 떠오르지 않았던 적 없으신가요. 저도 매일 독서하는 습관까지 잡아놓고 &#39;내가 책을 읽긴 읽은 건가&#39; 싶었던 사람입니다.<br /><br />그런데 답은 읽기가 아니고 쓰기 쪽에 있었습니다. 손으로 글씨를 쓸 때는 타이핑할 때와 달리 기억과 감각, 운동을 잇는 뇌 영역들의 연결성이 폭넓게 증가한다는 연구가 있습니다. 눈으로만 읽던 제 독서법에 손글씨와 필사를 붙여본 이야기를 정리했습니다.</p>
<p data-ke-size="size16"><br /><br /></p>

<section class="post-card">
<h2 data-ke-size="size26">제 독서법에는 남기는 단계가 없었다</h2>
<div class="card-body">
<p data-ke-size="size16">돌아보면 저는 독서를 성적표처럼 대하고 있었습니다. 한 달에 몇 권, 1년에 몇 권이라는 숫자는 쌓이는데 정작 그 책에서 뭘 느꼈고 제 삶에 뭐가 남았는지는 돌아본 적이 없었습니다. 읽었다는 사실 자체에 만족하고 다음 페이지로, 다음 책으로 넘어가기 바빴던 겁니다.<br /><br />눈으로 훑는 독서가 왜 쉽게 증발하는지는 필기 연구에서 힌트를 얻었습니다. 노트북으로 강의를 받아 적은 학생들은 들리는 대로 그대로 옮기는 경향이 강해서 내용을 소화하는 과정 없이 손가락만 움직였고, 손으로 적은 학생들은 속도가 느린 탓에 어쩔 수 없이 요약하고 자기 말로 바꾸면서 개념 이해 문제에서 더 좋은 성적을 냈다는 실험이 있습니다. <a href="https://pubmed.ncbi.nlm.nih.gov/24760141/" target="_blank" rel="noopener noreferrer">출처: Psychological Science(PubMed)</a><br /><br />제 독서가 딱 노트북 필기 같았습니다. 문장이 눈을 통과해 지나가기만 하고 제 언어로 바꾸는 정거장이 없었던 거죠. 문제는 몇 권을 읽느냐보다 한 문장이라도 제 것으로 만드는 장치가 있느냐였습니다.</p>
<div class="summary-card"><b>요약:</b> 눈으로만 훑는 독서는 내용을 자기 언어로 바꾸는 과정이 없어 쉽게 잊힌다. 강의를 그대로 받아 적은 노트북 필기보다 요약을 강제하는 손 필기가 개념 이해에서 앞섰다는 연구가 이를 뒷받침한다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">손글씨가 뇌를 다르게 켜고 있었다</h2>
<div class="card-body">
<p data-ke-size="size16">손으로 쓰는 순간 뇌에서 벌어지는 일은 측정으로도 확인돼 있습니다. 대학생들에게 같은 문장을 손글씨로 쓰게 하고 타이핑도 하게 한 뒤 뇌 활성을 비교한 실험에서, 손글씨를 쓸 때 좌측 전전두피질이 더 크게 활성화됐습니다. 전전두피질이란 이마 바로 뒤에 있는 전두엽의 앞부분으로 주의집중과 단기 기억, 계획 세우기를 담당하는 사령탑 같은 영역입니다. 다음에 쓸 내용을 떠올리고 글자 크기와 공간 배치까지 계획해야 하는 손글씨와 달리, 타이핑은 배치를 컴퓨터가 대신해주니 뇌가 그만큼 덜 일하는 셈입니다.<br /><br />노르웨이 과학기술대 연구팀이 대학생 36명의 뇌파를 256채널 장비로 기록한 연구에서도 손글씨를 쓸 때만 기억, 감각 처리, 운동을 잇는 뇌 영역 간 연결성이 폭넓게 증가했습니다. 이런 정교한 연결 패턴이 기억 형성과 새 정보 학습에 유리하다는 게 연구진의 결론입니다. <a href="https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2023.1219945/full" target="_blank" rel="noopener noreferrer">출처: Frontiers in Psychology</a><br /><br />아이들 실험은 더 생활에 가깝습니다. 초등학교 6학년 학생들이 4주 동안 하루 1시간씩 책을 필사했더니 글씨가 눈에 띄게 반듯해진 것은 물론, 10분을 못 버티던 아이가 30분 동안 자리를 지키며 쓰게 됐습니다. 자기효능감, 그러니까 과제를 끝까지 해낼 수 있다고 스스로 믿는 힘을 재는 검사에서도 수업 집중 항목이 2점 이상 오른 학생들이 나왔고 4점에서 9점까지 뛴 아이도 있었습니다. 잡생각 없이 쓰기만 했다는 아이의 말이 저는 제일 인상 깊었습니다.</p>
<div class="summary-card"><b>요약:</b> 손글씨를 쓸 때는 타이핑할 때보다 주의집중과 계획을 담당하는 좌측 전전두피질이 더 활성화되고, 기억·감각·운동 영역 간 연결성도 폭넓게 증가한다. 초등학생들이 4주간 매일 1시간 필사하자 집중 지속 시간과 자기효능감이 함께 올랐다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">필사는 세 줄이면 충분했다</h2>
<div class="card-body">
<p data-ke-size="size16">그래서 저는 독서법을 뜯어고치는 대신 작은 장치 하나를 붙였습니다. 읽다가 마음에 걸리는 문장이 나오면 밑줄을 긋고, 여백에 그때 떠오른 생각이나 감정을 짧게 적는 겁니다. 몇 줄 안 되는 낙서 같은 기록인데 신기하게도 눈으로만 읽을 때보다 내용이 훨씬 오래 남았습니다.<br /><br />그러다 보니 책을 대하는 방식도 바뀌었습니다. 요즘은 빌려 읽기보다 웬만하면 제 돈으로 사서 마음껏 긋고 적으면서 읽습니다. 깨끗하게 돌려줘야 하는 책 앞에서는 손이 묶이니까요. 제가 지키는 방식은 세 가지뿐입니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">마음에 걸리는 문장에 밑줄 긋고 여백에 내 생각 한 줄 적기</li>
<li data-ke-size="size16">하루 독서를 마치면 가장 남는 문장 세 줄만 노트에 손으로 옮겨 적기</li>
<li data-ke-size="size16">휘갈기며 빨리 쓰는 대신 문장을 이해하면서 정확하게 쓰기</li>
</ul>
<p data-ke-size="size16">한 권을 통째로 베껴 쓰는 거창한 필사는 시작도 못 했을 겁니다. 중요한 건 손을 움직이는 행위 자체보다 그 문장 앞에서 한 번 더 멈추고 생각하는 시간이라고 저는 봅니다. 결국 독서는 많이 읽는 경쟁이 아니라 읽은 것을 얼마나 오래 붙잡고 삶에 연결하느냐의 문제였습니다.</p>
<div class="summary-card"><b>요약:</b> 필사는 책 한 권을 통째로 베끼는 일이 필요 없다. 마음에 걸린 문장에 밑줄을 긋고 세 줄만 손으로 옮겨 적으며 자기 생각 한 줄을 덧붙이는 것으로 충분하며, 핵심은 문장 앞에서 한 번 더 멈추고 생각하는 시간이다.</div>
</div>
</section>
<br />

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 필사하려면 책 한 권을 다 베껴 써야 하는 거 아니야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 그렇게 잡았으면 저는 사흘도 못 갔을 겁니다. 하루 세 줄, 마음에 남은 문장만 옮기고 제 생각 한 줄을 붙입니다. 양이 아니고 멈춰서 생각하는 시간이 목적이라서 이 정도면 충분했습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 타이핑으로 메모하는 건 소용없다는 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 소용이 없지는 않고 저도 긴 정리는 키보드로 합니다. 다만 뇌 활성과 연결성에서 차이가 난다는 게 측정으로 확인됐고, 타이핑은 그대로 받아치기 쉬워서 요약이라는 소화 과정을 건너뛰게 됩니다. 기억에 남기고 싶은 문장만큼은 손으로 씁니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 악필인데 효과가 있을까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 글씨 모양은 조건이 아니었습니다. 이해하면서 정확하게 쓰는 태도가 핵심이고, 4주 실험에서는 아이들 글씨가 오히려 쓰다 보니 반듯해졌습니다. 악필은 출발점일 뿐 장애물이 되지는 않는다고 정리했습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 오늘 당장 뭐부터 해볼 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 지금 읽고 있는 책에서 어제 밑줄 그은 문장 하나를 노트에 옮겨 적을 겁니다. 그리고 그 옆에 왜 이 문장이 걸렸는지 한 줄 적어보려 합니다. 매일 독서 습관에 쓰는 습관을 하나씩 붙여가는 중입니다.</p>
</div>
</div>
</section>
<br />

<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 이제 책을 몇 권 읽었는지 세지 않습니다. 대신 이번 주에 손으로 옮겨 적은 문장이 몇 개인지 셉니다. 앞의 숫자는 쌓여도 사라졌지만 뒤의 숫자는 며칠이 지나도 머릿속에 남아 있었습니다.<br /><br />오늘 읽으신 것 중에 마음에 걸린 문장이 있다면 딱 한 줄만 손으로 옮겨보시길 권합니다. 펜과 종이만 있으면 지금 바로 되는 일입니다.<br /><br />이 글에도 밑줄 긋고 싶은 문장이 하나라도 있었다면 공감♥ 하나를 그 밑줄 삼아 남겨주세요. 읽어도 남는 게 없다고 느끼는 날 다시 오실 수 있게 구독해두시면 제가 다음 문장을 준비해두겠습니다.</p>

</div>
