<script type="text/template" id="srcData">
<p class="lead-intro" data-ke-size="size16">몇 해 전 모임 자리에서였습니다. 다들 웃고 떠드는 한가운데서 저는 문득 외롭다는 생각이 들었습니다. 분명 혼자가 아닌데도 그랬습니다. 일반적으로 외로움은 혼자 있어서 생기는 감정이라고 알려져 있지만, 제 경험은 달랐던 겁니다.<br /><br />그날 이후 이 감정의 정체가 궁금해졌습니다. 혼자 있는 시간을 두려워하던 제가 그 시간을 기다리게 되기까지의 이야기를 정리해봤습니다.</p>
<p data-ke-size="size16"><br /><br /></p>

<section class="post-card">
<h2 data-ke-size="size26">외로움의 정체부터 달랐다</h2>
<div class="card-body">
<p data-ke-size="size16">외로움은 곁에 사람이 있어도 찾아옵니다. 저는 예전에 그 감정이 생기면 누군가를 만나거나 연락하면서 지우려고 했습니다. 만나는 동안에는 괜찮아지는 것 같았는데 혼자가 되면 같은 감정이 다시 돌아왔습니다. 사람으로 덮는 방식은 저에게 임시방편이었던 셈입니다.<br /><br />외로움을 마음이 만들어낸 허상으로 보는 관점도 있습니다. 마음을 다스리면 사라지는 감정이라는 겁니다. 저는 절반만 동의합니다. 심리학 쪽 근거를 찾아보니 외로움은 몸에 실제 흔적을 남기고 있었습니다. 148개 연구를 묶어 종합한 메타분석이 있는데, 메타분석이란 같은 주제의 여러 연구 결과를 통계적으로 합쳐 전체 경향을 확인하는 연구 방법입니다. 이 분석에서 외로움은 조기 사망 위험을 26% 높이는 요인으로 나타났습니다. 흡연이나 비만에 견줄 만한 수치라고 합니다.<br /><br />그래서 저는 외로움을 무시해도 되는 착각으로만 보기는 어렵다고 생각합니다. 필요한 관계가 부족하다는 몸의 신호일 수 있기 때문입니다. 다만 그 신호에 어떻게 응답할지는 별개의 문제였습니다. 아무나 만나서 덮는 게 응답은 아니었으니까요.<br /><br />참고: <a href="https://pubmed.ncbi.nlm.nih.gov/25910392/" target="_blank" rel="noopener noreferrer">출처: Holt-Lunstad et al., Perspectives on Psychological Science(2015)</a></p>
<div class="summary-card"><b>요약:</b> 외로움은 함께 있어도 찾아오고, 무시할 허상이라기보다 관계가 부족하다는 몸의 신호에 가깝습니다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">외로움과 고독은 선택이 갈랐다</h2>
<div class="card-body">
<p data-ke-size="size16">정체를 알고 나니 다음 질문이 생겼습니다. 같은 혼자인데 왜 어떤 날은 괴롭고 어떤 날은 충만할까. 제가 찾은 답은 선택권이었습니다. 외로움과 고독을 가르는 건 혼자라는 사실이 아니라 그 시간을 제가 골랐느냐였습니다. 타의로 혼자가 되면 외로움이 되고, 스스로 고른 혼자는 고독이 됩니다.<br /><br />연구도 이 구분을 뒷받침합니다. 정서 조절을 다룬 실험이 있는데, 정서 조절이란 감정의 세기와 방향을 스스로 다루는 능력을 말합니다. 이 실험에서 혼자 있는 시간은 분노나 흥분 같은 고각성 감정을 가라앉히는 진정 효과를 보였습니다. 고각성 감정이란 심장이 뛰고 몸이 들뜨는 강한 상태의 감정을 가리킵니다. 특히 혼자 있는 동안 무엇을 생각할지 스스로 정한 사람들은 긍정적인 기분까지 유지했습니다. 혼자라는 조건보다 그 시간을 어떻게 쥐고 있느냐가 결과를 바꾼 겁니다.<br /><br />저도 처음에는 혼자 걷거나 책을 읽고 생각을 정리하는 시간이 어색했습니다. 반복하다 보니 오히려 그 시간이 편안해졌습니다. 다른 사람의 시선을 의식하지 않고 제가 무엇을 원하는지, 앞으로 어떻게 살고 싶은지를 생각할 수 있었기 때문입니다. 고독한 시간은 가장 솔직한 저와 마주 앉는 시간이었습니다.<br /><br />참고: <a href="https://pubmed.ncbi.nlm.nih.gov/29072531/" target="_blank" rel="noopener noreferrer">출처: Nguyen et al., Personality and Social Psychology Bulletin(2018)</a></p>
<div class="summary-card"><b>요약:</b> 스스로 고른 혼자는 감정을 가라앉히고 저를 마주하게 합니다. 갈림길은 혼자라는 사실이 아니라 선택권이었습니다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">혼자의 힘과 기대는 힘의 균형</h2>
<div class="card-body">
<p data-ke-size="size16">그래서 요즘 저는 외로움이 밀려올 때 섣불리 연락처부터 열지 않습니다. 힘든 일이 있을 때도 무조건 위로나 답을 구하기 전에 혼자 생각을 정리하는 시간을 먼저 가집니다. 그렇게 하고 사람을 만나니 감정에 휘둘리는 일이 눈에 띄게 줄었습니다.<br /><br />그렇다고 혼자 버티는 것만이 정답이라고 보지는 않습니다. 사람에게 기대는 행동을 무조건 부정적으로 볼 필요도 없다고 생각합니다. 가족이나 친구에게 솔직하게 마음을 털어놓는 게 문제를 푸는 데 도움이 될 때도 분명 있었습니다. 특히 만성 외로움은 주의해야 합니다. 만성 외로움이란 일시적으로 스쳐가지 않고 몇 달 이상 이어지는 외로움을 말하는데, 이 상태는 혼자 연습만으로 풀기 어려워 주변이나 전문가에게 도움을 요청하는 쪽이 낫습니다.<br /><br />제가 요즘 지키는 균형은 이렇습니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">외로움이 밀려오면 연락처를 열기 전에 혼자만의 30분(걷기, 쓰기)을 먼저 가진다</li>
<li data-ke-size="size16">그래도 남는 마음은 가장 편한 한 사람에게 솔직하게 말한다</li>
<li data-ke-size="size16">일주일에 한 번은 스스로 고른 혼자의 시간을 미리 달력에 넣어둔다</li>
</ul>
<p data-ke-size="size16">혼자 있는 힘과 도움을 요청하는 능력은 서로를 대신하지 못했습니다. 둘 사이의 균형을 찾는 게 제가 내린 결론입니다.</p>
<div class="summary-card"><b>요약:</b> 혼자 정리하는 시간을 먼저 갖되, 오래가는 외로움은 신호로 받아들이고 기댈 사람을 찾습니다. 둘의 균형이 핵심입니다.</div>
</div>
</section>
<br />

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 혼자가 편해진 나, 사람이 싫어진 걸까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 아니라고 저는 정리했습니다. 사람이 싫어진 게 아니고 저를 채우는 방법이 하나 더 늘어난 겁니다. 혼자의 시간이 편해진 뒤로 사람을 만나는 시간도 오히려 즐거워졌습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 오늘 밤 외로움이 밀려오면 뭘 할 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 연락처를 열기 전에 일단 30분을 저에게 주려 합니다. 걷거나 지금 마음을 적어볼 겁니다. 그러고도 남는 마음이면 그때 편한 사람에게 연락하겠습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 그래도 외로움이 몇 달씩 이어지면 어떡할 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 그건 연습 부족이 아니고 관계가 부족하다는 신호로 받아들이기로 했습니다. 참지 말고 사람을 찾고, 필요하면 전문가의 도움도 구할 겁니다. 몸의 신호를 무시하지 않는 게 저와의 약속입니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 고독 연습, 당장 뭐부터 시작할 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 이번 주 달력에 혼자의 시간 한 칸을 미리 넣어두는 것부터 하겠습니다. 스스로 고른 혼자는 기다려지는 시간이 된다는 걸 이미 겪어봤으니까요.</p>
</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 이제 외로움이 와도 예전처럼 허둥대며 사람으로 덮지 않습니다. 먼저 혼자만의 시간으로 들어가 마음을 가라앉히고, 그래도 남는 마음은 편한 사람에게 솔직하게 꺼냅니다. 이 순서 하나 바꿨을 뿐인데 외로움에 휘말려 후회할 일이 줄었습니다.<br /><br />오늘 문득 외로우셨다면 연락처를 열기 전에 혼자만의 30분을 먼저 가져보시길 권합니다. 그 시간이 편안해지는 순간부터 혼자는 더 이상 벌이 아니게 됩니다.<br /><br />다음에 또 외로움이 밀려오는 밤 이 글을 다시 찾아 헤매지 않으시려면 구독해두시는 걸 권합니다. 공감♥ 하나는 저에게 &#39;혼자 쓰는 이 시간이 헛되지 않았다&#39;는 확인으로 받겠습니다.</p>
<p data-ke-size="size16">참고: <a href="https://www.youtube.com/watch?v=0pP99GQehoE" target="_blank" rel="noopener noreferrer">https://www.youtube.com/watch?v=0pP99GQehoE</a></p>
</div>
</section>
