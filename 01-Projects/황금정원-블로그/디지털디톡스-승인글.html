<div class="card-body" style="padding:20px 22px;">
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 14px 0;">과학기술정보통신부의 스마트폰 과의존 실태조사에 따르면 성인 과의존위험군은 22.7%, 청소년은 40.1%에 달합니다(<a href="https://www.korea.kr/briefing/pressReleaseView.do?newsId=156681128" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;">출처: 대한민국 정책브리핑, 스마트폰 과의존 실태조사 결과</a>). 과의존이란 스마트폰 이용에 대한 조절력이 떨어지고 그로 인해 일상생활에 문제가 생기는 상태를 뜻하는데, 저는 제 얘기가 아니라고 생각했다가 이 수치를 보고 다시 하루를 돌아보게 됐습니다.<br /><br />질병관리청 국가건강정보포털에서는 스마트폰을 비롯한 디지털 기기 과의존이 인지기능에 영향을 준다고 설명합니다(<a href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoYouthView.do?cntnts_sn=6624" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;">출처: 질병관리청 국가건강정보포털</a>). 저도 책을 읽다가 알림 하나를 확인했을 뿐인데 다른 콘텐츠까지 보게 되는 경우가 많았는데, 이게 단순히 시간을 잃는 게 아니라 눈앞의 일에 집중하는 능력 자체가 끊기는 문제였다는 걸 알게 됐습니다. 요즘 독서나 공부처럼 제가 해야 할 일에 집중하려고 하다 보니, 휴대폰이 얼마나 자주 그 집중을 끊어놓는지도 더 선명하게 느끼게 됐습니다.</p>

<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 14px 0;">스마트폰이 계속 손이 가게 만드는 데는 도파민이라는 신경전달물질이 관여합니다. 도파민은 뇌의 보상 시스템에서 즐거움을 느끼게 하는 역할을 하는데, 알림이나 짧은 영상처럼 강하고 반복적인 자극이 계속되면 더 많은 자극을 원하게 되면서 오히려 집중력과 인내심이 약해진다고 합니다. 저는 이 설명을 보고 나서야, 딱히 볼 게 없는데도 습관적으로 휴대폰을 켜게 되는 이유를 이해했습니다.<br /><br />돌아보니 저에게 문제였던 건 휴대폰을 썼다는 사실 자체가 아니라, 목적 없이 켠 순간들이었습니다. 아침에 눈을 뜨자마자 시간만 확인하려다 SNS를 열고, 잠깐만 본다는 생각으로 시작했다가 예상보다 훨씬 오래 붙잡혀 있었던 경험이 저에게도 많았습니다. 특히 퇴근 후 피곤하다는 이유로 잠깐 휴대폰을 보고 있으면 어느새 한 시간이 훌쩍 지나가 있곤 했는데, 문제는 그 한 시간을 썼다는 것보다 그 시간이 지나고 나서 남는 게 거의 없다는 점이었습니다. 필요할 때 검색하고 확인하는 용도로 쓸 때는 전혀 문제가 없었는데, 목적 없이 켜는 순간부터 시간이 흘러가 버렸습니다.</p>

<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 14px 0;">휴대폰을 통제하는 것 자체가 목적이 아니라, 제 시간과 선택권을 휴대폰에 빼앗기지 않는 것이 진짜 목적이라고 저는 생각합니다. 완전히 끊어내겠다는 결심은 며칠 못 가 무너지기 쉬웠지만, 식사 시간 하나만 지키자는 작은 기준은 오히려 꾸준히 이어갈 수 있었습니다.</p>

<script>
var src = document.getElementById('src').textContent.trim();
document.getElementById('preview').innerHTML = src;
document.getElementById('htmlBox').value = src;
function copyText(id, btn) {
  var t = document.getElementById(id).textContent;
  doCopy(t, btn);
}
function copyBody(btn) {
  var box = document.getElementById('htmlBox');
  box.select();
  doCopy(box.value, btn);
}
function doCopy(text, btn) {
  var done = function() {
    var old = btn.textContent;
    btn.textContent = '복사 완료!';
    setTimeout(function(){ btn.textContent = old; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text); done();
  }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}
</script>
