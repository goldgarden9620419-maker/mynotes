<p class="lead-intro" data-ke-size="size16">솔직히 고백하자면 저는 직장생활 대부분을 의자에서 보냈습니다. 아침에 앉으면 점심시간을 빼고는 거의 같은 자세로 하루가 갔습니다. 허리가 자주 아프기 시작했을 때도, 남들에게 말하기 어려운 치핵으로 오래 고생할 때도 그저 나이 탓이려니 했습니다.<br /><br />그런데 자료를 찾아보니 범인은 따로 있었습니다. 수십 년을 함께한 그 의자였습니다. 앉는 습관이 몸에 남긴 청구서와 제가 시작한 밤 10분 관리법을 정리해봤습니다.</p>
<p data-ke-size="size16"><br /><br /></p>

<section class="post-card">
<h2 data-ke-size="size26">몸이 보낸 경고를 무시하고 있었다</h2>
<div class="card-body">
<p data-ke-size="size16">하루에 몇 시간이나 앉아 계신가요? 저는 세어보니 열 시간이 넘는 날이 대부분이었습니다. 문제는 앉는 시간이 운동과는 별개의 위험이라는 점입니다. 47개 연구를 종합한 메타분석에서 좌식 시간이 길수록 사망과 심혈관질환, 당뇨 위험이 높아졌는데, 이 위험은 운동량을 고려해 보정한 뒤에도 남아 있었습니다. 저녁 운동으로 낮의 열 시간을 전부 지울 수는 없다는 뜻이라 뜨끔했습니다.<br /><br />오래 앉으면 몸에서는 조용한 변화가 진행됩니다. 엉덩이 기억상실증이 대표적인데, 하루 종일 깔고 앉아만 있던 엉덩이 근육이 힘쓰는 법 자체를 잊어버리는 상태를 말합니다. 엉덩이가 일을 놓으면 그 부담은 허리와 무릎이 대신 받습니다. 고관절 내회전도 가장 먼저 사라지는 기능이라고 합니다. 고관절 내회전이란 허벅지 뼈가 안쪽으로 돌아가는 움직임인데, 이게 굳으면 걷고 앉는 모든 동작에서 무릎과 발목이 대신 무게를 떠안습니다.<br /><br />더 놀란 건 호흡 이야기였습니다. 앉는 시간이 길어지면 옆구리의 광배근이 짧게 굳는데, 이 근육이 굳으면 숨 쉴 때 흉곽 대신 목과 어깨를 쓰게 됩니다. 하루 종일 숨만 쉬어도 목과 어깨가 아파지는 구조가 되는 겁니다. 제 허리 통증도 치핵도 돌아보면 몸이 수년째 보내던 경고였습니다. 저는 아프면 그때서야 잠깐 쉬고 마는 식으로 그 경고를 계속 무시해왔던 셈입니다.<br /><br />참고: <a href="https://www.acpjournals.org/doi/10.7326/M14-1651" target="_blank" rel="noopener noreferrer">출처: Biswas et al., Annals of Internal Medicine(2015)</a></p>
<div class="summary-card"><b>요약:</b> 앉는 시간은 운동으로 다 지워지지 않는 별도의 위험입니다. 허리 통증과 굳은 몸은 나이보다 의자가 보낸 경고였습니다.</div>

<section class="post-card">
<h2 data-ke-size="size26">밤 10분 리셋이 습관이 됐습니다</h2>
<div class="card-body">
<p data-ke-size="size16">그럼 자기 전 스트레칭이면 될까요? 여기에도 반전이 있었습니다. 하루 종일 잠겨 있던 몸은 가만히 늘리기만 하는 자극에는 잘 반응하지 않는다고 합니다. 대신 필요한 게 동적 가동성 운동입니다. 동적 가동성이란 근육을 정지 상태로 늘리는 게 아니고 관절을 능동적으로 움직여 뇌에 새 신호를 보내는 방식을 말합니다. 영상의 밤 루틴도 골반을 네 지점으로 돌리고, 고관절을 안팎으로 회전시키고, 척추를 한 마디씩 말았다 펴는 식으로 전부 움직임 중심이었습니다. 마지막 이완 동작은 부교감 신경을 켜서 잠까지 도와준다고 합니다.<br /><br />직접 따라 해보니 골반 깊은 곳과 척추 사이가 뻐근하게 풀리는 느낌이 있었습니다. 운동이라고 하면 늘 시간을 내서 힘들게 해야 한다고 생각했는데 침대에서 10분이면 되는 관리도 있다는 게 저에게는 발견이었습니다.<br /><br />다만 저는 몇 가지 동작으로 틀어진 골반을 바로잡고 몸을 완전히 리셋할 수 있다는 식의 표현은 과장이 섞였다고 봅니다. 사람마다 몸 상태와 통증의 원인이 달라서 같은 운동이 모두에게 통한다고 단정하기 어렵기 때문입니다. 통증이 계속되면 운동 영상보다 진료가 먼저입니다. 핵심은 특정 루틴 하나를 만능 해결책으로 삼는 게 아니라 앉아 있는 시간 자체를 줄이고 틈틈이 움직이는 생활을 만드는 것이라고 생각합니다. 제가 정한 세 가지는 이렇습니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">낮에는 50분마다 한 번 일어난다 — 물 뜨러 가기, 서서 통화하기 같은 핑계를 미리 만들어둔다</li>
<li data-ke-size="size16">자기 전 10분은 골반과 고관절을 움직여서 푼다 — 늘리기보다 돌리기</li>
<li data-ke-size="size16">아프고 나서 관리를 시작하지 않는다 — 안 아픈 날에도 같은 루틴을 지킨다</li>
</ul>
<p data-ke-size="size16">몸 관리는 한 번의 강한 운동이 아니라 매일 반복하는 작은 습관에서 시작된다는 것. 수십 년 앉아 살아본 제가 몸으로 배운 결론입니다.<br /><br />참고: <a href="https://health.kdca.go.kr/" target="_blank" rel="noopener noreferrer">출처: 질병관리청 국가건강정보포털</a></p>
<div class="summary-card"><b>요약:</b> 밤 10분 동적 가동성 루틴은 좋은 도구지만 만능은 못 됩니다. 낮에 자주 일어나는 습관과 묶여야 진짜 관리가 됩니다.</div>
</div>
</section>
<br />

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 저녁마다 운동하는데 그럼 된 거 아니야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 저도 그렇게 믿고 싶었습니다. 그런데 좌식 시간의 위험은 운동량을 고려해도 남는다는 연구를 보고 생각을 바꿨습니다. 운동은 운동대로 하고 앉는 시간은 따로 줄이기로 했습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 일하다 보면 일어날 틈이 없는데 어떡할 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 틈은 안 나서가 아니라 안 만들어서 없었습니다. 물잔을 작은 걸로 바꾸면 자주 일어나게 되고, 전화는 서서 받으면 됩니다. 50분에 한 번, 2분이면 충분하다는 게 제 계산입니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 스트레칭은 지금까지도 해왔는데 왜 안 풀렸을까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 가만히 늘리기만 했던 게 이유였던 것 같습니다. 굳은 몸에는 관절을 능동적으로 움직이는 자극이 필요하다고 합니다. 늘리기에서 돌리기로 방식을 바꿔보고 있습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 오늘 밤 당장 뭐부터 해볼 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 침대에서 골반 네 지점 돌리기부터 해볼 겁니다. 그리고 내일 책상에 &#39;50분마다 기립&#39;이라고 써 붙이려 합니다. 아프고 나서 시작하는 관리는 이제 그만하기로 저와 약속했습니다.</p>
</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 이제 허리가 아픈 날 나이부터 탓하지 않습니다. 오늘 몇 시간 앉아 있었는지, 몇 번 일어났는지를 먼저 셉니다. 수십 년 쌓인 의자의 청구서를 하루아침에 갚을 수는 없어도 오늘 치 이자는 밤 10분으로 갚을 수 있었습니다.<br /><br />오늘도 하루 종일 앉아 계셨다면 자기 전에 골반부터 천천히 돌려보시길 권합니다. 몸은 정직해서 움직여준 만큼 다음 날 아침으로 갚아줍니다.<br /><br />다음에 허리가 뻐근한 밤 이 글을 찾아 헤매지 않으시려면 구독해두시는 걸 권합니다. 공감♥ 하나는 저에게 의자에서 일어날 핑계 하나가 되어 줍니다.</p>
<p data-ke-size="size16">참고: <a href="https://www.youtube.com/watch?v=4aq3k1iJNqo" target="_blank" rel="noopener noreferrer">https://www.youtube.com/watch?v=4aq3k1iJNqo</a></p>
</div>
