<p data-ke-size="size16" style="font-size:1.06rem;line-height:2;color:#1f2937;margin:0 0 10px 0;">솔직히 저는 어싱이 과학인지 따져보지도 않고 맨발 걷기를 즐겨온 사람입니다. 일주일에 사흘은 저녁 먹고 운동화를 벗은 채 흙길을 걷고, 그 시간이 좋아서 남들에게 권하기도 했습니다.<br /><br />그러다 어싱 이론을 제대로 뜯어본 내용을 접하고 생각이 정리됐습니다. 맨발 걷기의 운동 효과는 실재하지만, 땅의 자유전자가 몸속 활성산소를 중화해 병을 고친다는 어싱 이론은 과학적 근거가 부족하다는 겁니다. 효과는 진짜인데 이유가 달랐던 셈입니다. 그 사이 어디쯤에 제 저녁 산책이 있는지 정리해봤습니다.</p>
<p data-ke-size="size16"><br /></p>

<h2 data-ke-size="size26" style="font-size:1.32rem;font-weight:700;color:#111827;margin:38px 0 16px 0;padding-bottom:10px;border-bottom:2px solid #111827;">맨발걷기가 제 저녁 루틴이 된 이유</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">하루 종일 회사에서 숫자와 씨름하고 나면 퇴근을 해도 머릿속은 퇴근을 못 합니다. 해결 못 한 일과 내일 할 일이 계속 맴돌아서요. 그래서 저는 저녁을 먹고 이어폰 없이 혼자 걷는 시간을 일주일에 사흘 이상 지킵니다. 걷다 보면 복잡하던 생각이 하나씩 자리를 찾아갑니다.<br /><br />그중에서도 제가 아끼는 건 맨발 코스입니다. 운동화를 벗고 첫발을 내딛는 순간 발바닥으로 올라오는 서늘한 온도와 흙의 감촉이 좋아서, 하루 내내 긴장했던 몸이 그 자리에서 풀리는 기분이 듭니다. 신기한 건 맨발로 걸은 날은 소화까지 더 빨리 되는 느낌이라는 겁니다. 저만 그런 건지는 모르겠습니다만.<br /><br />요즘 지자체마다 황톳길을 깔 만큼 맨발 걷기 열풍이 뜨겁고, 효과를 봤다는 증언도 넘칩니다. 저도 그 증언 대열에 서 있던 사람이라 이 유행의 설명서 격인 어싱 이론이 궁금해졌습니다.</p>
<div style="margin:20px 0 8px 0;padding:12px 4px;border-top:1px solid #d1d5db;border-bottom:1px solid #d1d5db;font-size:0.95rem;line-height:1.8;color:#1f2937;"><b>핵심 한 줄</b> · 맨발 걷기는 발바닥 감촉과 하루를 정리하는 시간 덕분에 꾸준히 이어지는 저녁 루틴이 되기 쉽다. 유행의 설명으로 쓰이는 어싱 이론은 별도로 따져볼 문제다.</div>

<h2 data-ke-size="size26" style="font-size:1.32rem;font-weight:700;color:#111827;margin:38px 0 16px 0;padding-bottom:10px;border-bottom:2px solid #111827;">어싱 이론을 뜯어보니 이랬다</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">일반적으로 어싱은 이렇게 설명됩니다. 몸속에는 플러스 전하를 띠는 활성산소가 있는데, 활성산소란 세포를 손상시키고 노화를 앞당기는 산소 찌꺼기입니다. 땅에는 마이너스 전하의 자유전자가 있으니 맨발로 접지하면 둘이 중화되면서 병까지 낫는다는 논리입니다. 측정기를 몸에 대고 땅을 밟으면 수치가 0이 되는 시연 영상도 돌아다닙니다.<br /><br />그런데 물리로 보면 그 0은 당연한 숫자였습니다. 전위차란 두 지점 사이의 전기적 높이 차이인데, 수위가 다른 물이 바다와 연결되면 높이가 같아지듯 몸이 땅에 닿으면 전위차가 0이 되는 건 정의상 자연스러운 현상입니다. 몸속 독소가 빠져나갔다는 증거와는 거리가 멉니다. 심장과 뇌와 피부가 제각각 복잡한 전기 신호로 움직이는데, 접지 하나로 그 전체가 치료될 리도 없고요.<br /><br />근거로 가장 많이 인용되는 2012년 어싱 논문도 들여다보면 사정이 있습니다. 저자 다섯 명 중 세 명이 접지 연구를 후원하는 회사의 계약자이면서 지분을 가진 사람들이었습니다. 사탕 회사 대표에게 설탕이 몸에 좋은지 묻는 구도인 셈입니다. <a href="https://pubmed.ncbi.nlm.nih.gov/22291721/" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;">출처: PubMed(해당 논문, 이해충돌 고지·저자 소속에 어싱 관련 회사 표기)</a> 여기에 어싱 매트를 수백만 원에 팔다가 적발된 업체 사례까지 있다고 하니, 제가 느낀 개운함과는 별개로 이 설명서는 걸러서 봐야겠다고 판단했습니다.<br /><br />그럼 효과를 봤다는 그 많은 증언은 뭘까요. 하나는 플라시보 효과로 보입니다. 플라시보 효과란 가짜 약도 믿고 먹으면 실제로 몸이 좋아지는 현상인데, 권하는 사람을 신뢰할수록 강하게 나타난다고 합니다. 걷기 자체의 운동 효과에 이 믿음이 얹히면 몸은 정말 좋아질 수 있습니다. 효과의 경험은 진짜고 설명이 빗나간 겁니다.</p>
<div style="margin:20px 0 8px 0;padding:12px 4px;border-top:1px solid #d1d5db;border-bottom:1px solid #d1d5db;font-size:0.95rem;line-height:1.8;color:#1f2937;"><b>핵심 한 줄</b> · 접지 시 전위차가 0이 되는 것은 당연한 물리 현상일 뿐 치료의 증거가 되지 못한다. 어싱의 대표 논문은 저자들이 어싱 업체와 이해관계가 있었고, 체감 효과의 상당 부분은 걷기 운동과 플라시보로 설명된다.</div>

<h2 data-ke-size="size26" style="font-size:1.32rem;font-weight:700;color:#111827;margin:38px 0 16px 0;padding-bottom:10px;border-bottom:2px solid #111827;">그래도 저는 계속 맨발로 걷는다</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">결론이 &#39;맨발 걷기 그만두자&#39;는 쪽으로 가지 않는 이유가 있습니다. 어싱과 무관하게 맨발 걷기 자체의 근거 있는 이점이 따로 있기 때문입니다. 평소 신발 안에서 잠자던 발바닥 감각이 깨어나고, 울퉁불퉁한 지면을 걸으면 같은 거리를 걸어도 에너지 소모가 커지고 발과 다리 근육이 더 일합니다. 걷기라는 운동 자체가 건강에 이롭다는 건 질병관리청도 안내하는 상식이고요. <a href="https://health.kdca.go.kr/" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;">출처: 질병관리청 국가건강정보포털</a><br /><br />그래서 제 원칙은 세 가지로 정리됐습니다.</p>
<ul style="list-style-type:disc;margin:12px 0 16px 24px;padding:0;" data-ke-list-type="disc">
<li data-ke-size="size16" style="margin:6px 0;line-height:1.85;color:#374151;font-size:1rem;">유리나 돌이 없는 관리된 황톳길·맨발 코스에서 20~30분만 걷기</li>
<li data-ke-size="size16" style="margin:6px 0;line-height:1.85;color:#374151;font-size:1rem;">효과를 제품에서 찾지 않기 — 수백만 원짜리 매트 대신 땅은 공짜</li>
<li data-ke-size="size16" style="margin:6px 0;line-height:1.85;color:#374151;font-size:1rem;">이어폰 없이 걸으며 하루를 정리하는 저만의 시간으로 쓰기</li>
</ul>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">생각해보면 제가 맨발 걷기를 좋아하는 진짜 이유는 건강해진다는 믿음보다 그 시간만큼은 누구의 눈치도 보지 않고 온전히 저 자신으로 돌아갈 수 있어서였습니다. 좋은 경험이 반드시 과학적 진실일 필요는 없습니다. 다만 그 경험을 과학으로 포장해 지갑을 열게 하는 쪽은 경계해야 합니다. 건강을 지키는 건 특별한 제품이 아니라 꾸준히 실천하는 저만의 습관이라고 믿습니다.</p>
<div style="margin:20px 0 8px 0;padding:12px 4px;border-top:1px solid #d1d5db;border-bottom:1px solid #d1d5db;font-size:0.95rem;line-height:1.8;color:#1f2937;"><b>핵심 한 줄</b> · 맨발 걷기는 감각 자극과 에너지 소모 증가라는 어싱과 무관한 이점이 있다. 관리된 길에서 20~30분, 제품 구매 없이, 하루를 정리하는 시간으로 쓰는 것이 현실적인 활용법이다.</div>

<h2 data-ke-size="size26" style="font-size:1.32rem;font-weight:700;color:#111827;margin:38px 0 16px 0;padding-bottom:10px;border-bottom:2px solid #111827;">제가 저에게 던진 질문들</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.85;color:#5b21b6;margin:22px 0 6px 0;"><b>Q. 맨발로 걸으면 소화가 잘 되는 느낌, 착각이야?</b></p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.9;color:#374151;margin:0 0 4px 0;">A. 착각이라고 단정하지 않기로 했습니다. 식후에 걷는 것 자체가 소화에 도움이 되고 기분이 풀리면 속도 편해지니까요. 다만 그 공을 땅속 전자에게 돌릴 근거는 없다는 것만 구분해두기로 했습니다.</p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.85;color:#5b21b6;margin:22px 0 6px 0;"><b>Q. 어싱 매트 하나 들여놓을까 고민했는데?</b></p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.9;color:#374151;margin:0 0 4px 0;">A. 저는 접었습니다. 수백만 원대 매트를 팔다가 적발된 업체 사례를 보고 나니 더 그렇습니다. 걷고 싶으면 공원이 있고 땅은 돈을 받지 않습니다.</p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.85;color:#5b21b6;margin:22px 0 6px 0;"><b>Q. 그럼 어싱으로 효과 봤다는 사람들은 다 속은 거야?</b></p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.9;color:#374151;margin:0 0 4px 0;">A. 그분들의 좋아진 몸은 진짜라고 봅니다. 걷기 운동의 효과에 믿음이 얹혀서 나타난 결과일 가능성이 크다는 것뿐입니다. 경험을 부정할 이유는 없고 설명만 바로잡으면 됩니다.</p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.85;color:#5b21b6;margin:22px 0 6px 0;"><b>Q. 오늘 저녁엔 뭘 할 거야?</b></p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.9;color:#374151;margin:0 0 4px 0;">A. 저녁 먹고 맨발 코스로 나갈 겁니다. 이어폰은 두고 가서 오늘 꼬인 일 하나를 걸으면서 풀어보려 합니다. 효과의 이유를 알고 걸으니 오히려 마음이 더 가볍습니다.</p>

<h2 data-ke-size="size26" style="font-size:1.32rem;font-weight:700;color:#111827;margin:38px 0 16px 0;padding-bottom:10px;border-bottom:2px solid #111827;">결론</h2>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">저는 효과와 설명을 분리하는 법을 이번에 배웠습니다. 맨발 걷기의 개운함은 챙기고, 그 개운함을 전자와 중화로 포장하는 설명과 수백만 원짜리 제품은 걸러냅니다.<br /><br />몸에 좋다는 유행을 만나면 두 가지만 물어보시길 권합니다. 이 효과가 운동 자체의 효과와 뭐가 다른가, 그리고 이 설명 끝에 뭘 팔려고 하는가.<br /><br />오늘 저녁 운동화를 벗고 흙을 밟으셨다면 공감♥ 하나는 맨발로 꾹 눌러주신 발도장으로 받겠습니다. 건강 유행을 하나씩 따져보는 글을 계속 쓰고 있으니 지갑 열기 전에 들르시도록 구독해두셔도 좋습니다.</p>
<p data-ke-size="size16" style="font-size:1rem;line-height:1.95;color:#374151;margin:0 0 16px 0;">참고: <a href="https://www.youtube.com/watch?v=gLOiX9I8Kkc" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;">https://www.youtube.com/watch?v=gLOiX9I8Kkc</a></p>
</script>
