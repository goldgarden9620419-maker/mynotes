<p class="lead-intro" data-ke-size="size16">솔직히 저는 오랫동안 착한 사람이라는 말을 듣고 싶었습니다. 회사에서 누군가의 표정이 어두우면 &#39;제가 뭘 잘못했나&#39;부터 떠올렸고, 하고 싶은 말은 상대 기분을 살피다 그냥 삼켰습니다.<br /><br />그런데 남의 시선과 눈치에 시달리던 제게 뼈아픈 지적이 하나 날아왔습니다. 잘 보이고 싶은 마음의 정체는 배려라기보다 좋은 평가를 받고 싶다는 욕심이라는 겁니다. 착한 사람 콤플렉스에 대한 이 진단을 제가 어떻게 소화했는지 정리했습니다.</p>
<p data-ke-size="size16"><br /><br /></p>

<section class="post-card">
<h2 data-ke-size="size26">그 사람의 마음은 누구의 몫일까요</h2>
<div class="card-body">
<p data-ke-size="size16">똑같은 강연을 듣고도 어떤 사람은 훌륭하다며 나가고, 어떤 사람은 험담을 하며 나갑니다. 제가 아무리 잘해도 저를 싫어하는 사람이 있었고, 특별히 해준 것도 없는데 저를 편하게 대해주는 사람도 있었습니다. 사람의 감정은 각자의 자유라서 제가 이래라저래라 할 수 있는 영역이 애초에 없었던 겁니다.<br /><br />그런데도 저는 상대의 말투가 평소보다 차가우면 하루 종일 그 장면을 되감았습니다. 심리학은 이런 성향에 이름을 붙여놨습니다. 관계에 과도하게 투자하고 남의 인정에 기대는 성향을 사회지향성(sociotropy)이라고 부르는데, 이 성향이 강할수록 우울 증상이나 부정적인 자동적 사고와 연결된다는 연구가 있습니다. <a href="https://pubmed.ncbi.nlm.nih.gov/7897087/" target="_blank" rel="noopener noreferrer">출처: PubMed(미국국립의학도서관)</a><br /><br />저를 여기에 비춰보니 변명할 수가 없었습니다. 남이 저를 어떻게 보느냐는 그 사람의 몫인데, 저는 그 몫까지 제 숙제로 끌어안고 살았던 겁니다. 잘 보이고 싶다는 건 결국 해놓은 것 없이 좋게 봐달라는 요구고, 그 요구가 욕심이라는 지적이 아프지만 맞았습니다.</p>
<div class="summary-card"><b>요약:</b> 남이 나를 좋아하느냐 싫어하느냐는 그 사람의 감정이고 그 사람의 몫이다. 관계와 인정에 과도하게 매달리는 사회지향성이 강할수록 우울과 연결된다는 연구가 있으며, 타인의 평가는 통제할 수 있는 영역이 애초에 없다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">착한 사람의 속은 정말 착할까요</h2>
<div class="card-body">
<p data-ke-size="size16">저는 참는 게 배려인 줄 알았습니다. 관계가 틀어질까 봐 무조건 맞춰주고, 속으로 불편하면서 괜찮은 척했습니다. 그런데 그 속을 열어보니 다른 게 들어 있었습니다. 말을 삼킨 건 상대를 배려해서가 아니라 싫은 소리를 듣는 게 두려워서였습니다.<br /><br />이런 상태를 흔히 착한 사람 콤플렉스라고 부릅니다. 겉으로는 순하고 무던해 보이지만 속에는 &#39;내가 말하면 상대가 들어줘야 한다&#39;는 요구가 강하게 깔려 있어서, 안 들어줄 것 같으면 아예 입을 닫아버리는 상태를 말합니다. 세상이 제 뜻대로 되기를 바라는 마음이 순한 얼굴을 하고 있는 셈입니다.<br /><br />무서운 건 그다음입니다. 입을 꾹 닫고 쌓아두던 사람은 어느 날 한 번에 터집니다. 저도 처음에는 제가 참아서 관계를 지킨다고 생각했는데, 시간이 지나니 혼자 지치고 상대를 원망하게 되는 순간이 왔습니다. 저를 계속 희생하면서 유지하는 관계가 과연 건강한 관계인지, 그 질문 앞에서 저는 답을 못 했습니다.<br /><br />좋은 소리만 듣고 싶은 마음도 다시 보게 됐습니다. 어떤 사람은 돈을 좇고 어떤 사람은 자리를 좇는데, 저는 칭찬을 좇고 있었을 뿐입니다. 종류만 다르지 같은 줄에 서 있는 욕심이었습니다.</p>
<div class="summary-card"><b>요약:</b> 착한 사람 콤플렉스는 상대를 위한 배려 대신 &#39;내 말을 들어줘야 한다&#39;는 강한 요구와 좋은 평가를 받고 싶은 욕심이 순한 얼굴을 하고 있는 상태다. 참기만 하는 사람은 감정을 쌓아두다가 어느 날 한 번에 터진다.</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">그럼 내일부터 뭘 하면 될까요</h2>
<div class="card-body">
<p data-ke-size="size16">거창한 결심은 오히려 저를 또 지치게 했습니다. 그래서 저는 연습 세 가지만 남겼습니다.</p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li data-ke-size="size16">제 할 일을 제대로 하고, 기본 예의를 지키고, 잘못하면 인정하기 — 그 이후의 평가는 그 사람 몫으로 두기</li>
<li data-ke-size="size16">할 말은 하되, 돌아오는 반응은 &#39;그럴 수도 있지&#39; 하고 받아들이는 연습</li>
<li data-ke-size="size16">남들 갈등에는 편들지 말고 들어만 주기 — 해결까지 하려는 건 남의 인생에 대한 간섭</li>
</ul>
<p data-ke-size="size16">두 번째가 제일 어려웠습니다. 자기주장이라는 게 상대를 이기는 기술이 아니고, 제 생각을 말한 뒤 상대의 반응을 상대의 것으로 남겨두는 태도라는 걸 연습하면서 알았습니다. 상대가 &#39;당신은 당신밖에 모른다&#39;고 받아치면 &#39;그 말도 일리가 있네&#39; 하고 다음에 또 말하면 됩니다.<br /><br />물론 아직도 누가 저를 안 좋게 본다는 느낌이 들면 마음이 쓰입니다. 사람이 하루아침에 바뀌지는 않았습니다. 그래도 예전처럼 상대의 표정 하나, 말 한마디를 곱씹으며 저를 괴롭히는 일은 줄었습니다. 신경 쓸 대상을 바꿨기 때문입니다. 모든 사람에게 좋은 사람이 되는 것 대신, 제가 봤을 때 부끄럽지 않은 사람이 되는 쪽으로요.</p>
<div class="summary-card"><b>요약:</b> 할 일을 하고 평가는 상대 몫으로 두기, 할 말을 한 뒤 반응은 &#39;그럴 수도 있지&#39;로 받기, 남의 갈등은 들어만 주기 — 이 세 가지 연습이 남의 시선에서 벗어나는 실질적인 방법이다. 기준은 모든 사람에게 좋은 사람 대신 스스로에게 부끄럽지 않은 사람이다.</div>
</div>
</section>
<br />

<section class="post-card faq-card">
<h2 data-ke-size="size26">제가 저에게 던진 질문들</h2>
<div class="card-body">
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 그래도 누가 날 싫어하는 것 같으면 계속 신경 쓰이던데?</b></p>
<p class="faq-a" data-ke-size="size16">A. 그 마음이 올라오는 것 자체는 오래된 습관이라 막을 수 없다는 걸 인정했습니다. 대신 올라올 때마다 &#39;아, 또 칭찬받고 싶은 마음이 반응하는구나&#39; 하고 알아차리고 내려놓는 연습을 합니다. 없애는 게 목표가 아니고 알아차리는 게 목표입니다. 국가정신건강정보포털에서도 이런 마음 다루기 정보를 찾아볼 수 있습니다. <a href="https://www.mentalhealth.go.kr/" target="_blank" rel="noopener noreferrer">출처: 국가정신건강정보포털</a></p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 할 말 다 하고 살면 관계가 나빠지지 않을까?</b></p>
<p class="faq-a" data-ke-size="size16">A. 저도 그게 무서워서 수십 년을 삼키고 살았습니다. 그런데 참다가 터지는 쪽이 관계를 더 크게 망가뜨린다는 걸 겪어봤습니다. 말을 하고 상대의 반응을 존중하는 쪽이 길게 보면 훨씬 건강했습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 친구 둘이 싸우고 각자 나한테 하소연하면 어떻게 할 거야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 들어만 줄 겁니다. &#39;그랬구나, 힘들었겠다&#39;까지만 하고 누구 편도 안 들고 해결하려고도 안 할 겁니다. 상담의 90%는 들어주는 거라는 말을 이제야 이해했습니다. 판정까지 하려던 건 제 능력에 대한 과대평가였습니다.</p>
</div>
<p data-ke-size="size16"><br /></p>
<div class="faq-item">
<p class="faq-q" data-ke-size="size16"><b>Q. 착한 사람을 그만두면 나쁜 사람이 되는 거 아니야?</b></p>
<p class="faq-a" data-ke-size="size16">A. 그만두는 건 착함 자체가 아니고 착하게 보이려는 욕심이라는 걸 구분하게 됐습니다. 예의를 지키고 도울 일은 돕되, 그 대가로 좋은 평가를 요구하지 않는 것. 그게 제가 정리한 기준입니다.</p>
</div>
</div>
</section>
<br />

<section class="post-card">
<h2 data-ke-size="size26">결론</h2>
<div class="card-body">
<p data-ke-size="size16">저는 이제 하루의 끝에 다른 질문을 던집니다. &#39;오늘 사람들이 나를 좋게 봤을까&#39; 대신 &#39;오늘 나는 나에게 부끄럽지 않았나&#39;를 묻습니다. 앞의 질문은 답이 남의 손에 있고, 뒤의 질문은 답이 제 손에 있습니다.<br /><br />오늘도 누군가의 표정을 살피느라 지치셨다면, 그 사람의 마음은 그 사람 몫으로 돌려주고 잠드시길 권합니다.<br /><br />이 글도 모든 분께 좋은 글일 수는 없다는 걸 이제는 압니다. 그래도 눈치 보느라 지친 하루에 조금이라도 닿았다면 공감♥ 하나를 &#39;오늘은 눈치 그만 봐도 된다&#39;는 허락으로 받겠습니다. 이런 마음 정리가 필요한 날 다시 오실 수 있게 구독해두셔도 좋습니다.</p>
<p data-ke-size="size16">참고: <a href="https://www.youtube.com/watch?v=W7QFYeVoXXU" target="_blank" rel="noopener noreferrer">https://www.youtube.com/watch?v=W7QFYeVoXXU</a></p>
</div>
