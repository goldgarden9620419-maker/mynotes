const STEM_TO_OHANG = {
  "甲": "木", "乙": "木", "丙": "火", "丁": "火", "戊": "土",
  "己": "土", "庚": "金", "辛": "金", "壬": "水", "癸": "水",
};
const STEMS = "甲乙丙丁戊己庚辛壬癸";
const BRANCHES = "子丑寅卯辰巳午未申酉戌亥";

// Julian Day Number (proleptic Gregorian) - lunar_python 계산 결과와 offset=49로 검증 완료
function jdn(y, m, d) {
  const a = Math.floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4)
    - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}

function getIlju(y, m, d) {
  const j = jdn(y, m, d);
  const k = ((j + 49) % 60 + 60) % 60;
  const stem = STEMS[k % 10];
  const branch = BRANCHES[k % 12];
  return stem + branch;
}

// 문자열 -> 32bit 해시 (FNV-1a)
function hashStr(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

// seed 고정 PRNG (mulberry32)
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function seededSample(pool, seedStr, k) {
  const rng = mulberry32(hashStr(seedStr));
  const arr = pool.slice();
  // Fisher-Yates (시드 고정)
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, Math.min(k, arr.length));
}

const ILJU_INDEX = {};
const OHANG_INDEX = {};
for (const c of CELEBRITY_DB) {
  c.ohang = STEM_TO_OHANG[c.ilju[0]];
  (ILJU_INDEX[c.ilju] = ILJU_INDEX[c.ilju] || []).push(c);
  (OHANG_INDEX[c.ohang] = OHANG_INDEX[c.ohang] || []).push(c);
}

function match(y, m, d, maxResults = 3) {
  const ilju = getIlju(y, m, d);
  const ohang = STEM_TO_OHANG[ilju[0]];
  const exact = ILJU_INDEX[ilju] || [];

  if (exact.length > 0) {
    return {
      matchType: "exact",
      ilju, ohang,
      celebrities: exact.slice(0, maxResults),
      ohangCopy: OHANG_COPY[ohang],
    };
  }

  const pool = OHANG_INDEX[ohang] || [];
  const seedStr = `${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const picks = seededSample(pool, seedStr, maxResults);
  return {
    matchType: "fallback_ohang",
    ilju, ohang,
    celebrities: picks,
    ohangCopy: OHANG_COPY[ohang],
  };
}

function render(r) {
  document.getElementById("iljuBadge").textContent = `일주 ${r.ilju} · 오행 ${r.ohang}`;
  document.getElementById("ohangTitle").textContent = r.ohangCopy.title;
  document.getElementById("ohangTagline").textContent = r.ohangCopy.tagline;
  document.getElementById("cardLine").textContent = `"${r.ohangCopy.card_line}"`;

  const kwWrap = document.getElementById("keywords");
  kwWrap.innerHTML = "";
  r.ohangCopy.keywords.forEach(k => {
    const span = document.createElement("span");
    span.className = "keyword";
    span.textContent = "#" + k;
    kwWrap.appendChild(span);
  });

  document.getElementById("matchType").textContent =
    r.matchType === "exact"
      ? "✨ 일주가 정확히 일치하는 유명인을 찾았어요"
      : "🔎 정확히 일치하는 인물은 없어서, 같은 오행 유형의 유명인을 보여드려요";

  const list = document.getElementById("celebList");
  list.innerHTML = "";
  r.celebrities.forEach(c => {
    const card = document.createElement("div");
    card.className = "celeb-card";
    card.innerHTML = `
      <div class="celeb-name">${c.name}</div>
      <div class="celeb-ilju">일주 ${c.ilju}</div>
      <div class="celeb-field"><span class="label">성공 스토리</span>${c.story}</div>
      <div class="celeb-field"><span class="label">핵심 습관·마인드셋</span>${c.habit}</div>
      <div class="celeb-motto">"${c.motto}"</div>
    `;
    list.appendChild(card);
  });

  document.getElementById("result").style.display = "block";
}

document.getElementById("submitBtn").addEventListener("click", () => {
  const val = document.getElementById("birthdate").value;
  if (!val) { alert("생년월일을 선택해주세요"); return; }
  const [y, m, d] = val.split("-").map(Number);
  const r = match(y, m, d);
  render(r);
  document.getElementById("result").scrollIntoView({behavior: "smooth"});
});
